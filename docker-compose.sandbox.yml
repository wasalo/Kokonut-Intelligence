# Usage: docker compose -f docker-compose.yml -f docker-compose.sandbox.yml --profile sandbox --profile metabase up -d

services:
  metabase:
    ports:
      - "127.0.0.1:3001:3000"

  sandbox-seed:
    image: postgis/postgis:14-3.4@sha256:d803ac7dab61c5e5c36b8597e4a77d4a60be075507672e08da8aaba022dd9aaa
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - ./schemas:/schemas:ro
      - ./dashboards:/dashboards:ro
    entrypoint: ["/bin/bash", "/scripts/sandbox-setup.sh"]
    environment:
      PGHOST: "database"
      PGPORT: "5432"
      PGDATABASE: "kokonut_intelligence"
      PGUSER: "kokonut"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      DIRECTUS_URL: "http://directus:8055"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    profiles:
      - sandbox
