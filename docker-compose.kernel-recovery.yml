# Standalone recovery destination. Never overlay onto a running deployment.
name: kokonut-kernel-recovery
services:
  database:
    image: ${KOKONUT_RECOVERY_DATABASE_IMAGE:?Set the recorded source database image ID}
    platform: linux/amd64
    restart: "no"
    stop_grace_period: 40s
    environment:
      POSTGRES_USER: kokonut
      POSTGRES_DB: kokonut_intelligence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Load encrypted secrets}
    # A full single-transaction pg_restore holds locks on the complete schema
    # until commit; the Kernel schema exceeds PostgreSQL's default lock budget.
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "max_locks_per_transaction=4096",
      ]
    volumes:
      - recovery-postgres-data:/var/lib/postgresql/data
    networks: [recovery]
    healthcheck:
      # The PostGIS entrypoint starts a temporary server while initializing
      # extensions. During that phase PID 1 is the entrypoint shell, not postgres.
      test: ["CMD-SHELL", "test \"$(cat /proc/1/comm)\" = postgres && pg_isready -h 127.0.0.1 -U kokonut -d kokonut_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  recovery:
    internal: true
volumes:
  recovery-postgres-data:
