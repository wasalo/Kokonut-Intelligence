    networks:
      kernel: null
    profiles:
      - runtime
    restart: unless-stopped
    stop_grace_period: 40s
    volumes:
      - source: kernel-gateway-audit-spool
        target: /var/lib/kokonut/gateway-audit
        type: volume
        volume: {}
      - read_only: true
        source: ${KOKONUT_SENSOR_CSV_HOST_DIR:-./data/sensor-inputs}
        target: /var/lib/kokonut/sensor-inputs
        type: bind
  zitadel-api:
    command:
      - start-from-init
      - --masterkeyFromEnv
      - --tlsMode
      - external
    depends_on:
      zitadel-bootstrap-permissions:
        condition: service_completed_successfully
        required: true
      zitadel-db:
        condition: service_healthy
        required: true
    environment:
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://zitadel:${KOKONUT_ZITADEL_DATABASE_PASSWORD:?Set
        a URL-safe ZITADEL database role secret}@zitadel-db:5432/zitadel?sslmode=disable
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://${KOKONUT_ZITADEL_DOMAIN:?Set
        the ZITADEL public hostname}:${KOKONUT_KERNEL_HTTPS_PORT:-8448}/ui/v2/login/
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_EXTERNALDOMAIN: ${KOKONUT_ZITADEL_DOMAIN:?Set the ZITADEL public hostname}
      ZITADEL_EXTERNALPORT: ${KOKONUT_KERNEL_HTTPS_PORT:-8448}
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${KOKONUT_ZITADEL_ADMIN_PASSWORD:?Set
        the initial ZITADEL administrator password}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${KOKONUT_ZITADEL_ADMIN_USERNAME:?Set
        the initial ZITADEL administrator username}
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Kokonut Login UI client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${KOKONUT_ZITADEL_LOGIN_CLIENT_PAT_EXPIRATION:?Set
        a reviewed Login UI token expiry date}
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "true"
      ZITADEL_MASTERKEY: ${KOKONUT_ZITADEL_MASTERKEY:?Set the stable 32-character
        ZITADEL master key}
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://${KOKONUT_ZITADEL_DOMAIN:?Set the ZITADEL
        public hostname}:${KOKONUT_KERNEL_HTTPS_PORT:-8448}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://${KOKONUT_ZITADEL_DOMAIN:?Set the ZITADEL
        public hostname}:${KOKONUT_KERNEL_HTTPS_PORT:-8448}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_TLS_ENABLED: "false"
    healthcheck:
      interval: 10s
      retries: 12
      start_period: 30s
      test:
        - CMD
        - /app/zitadel
        - ready
      timeout: 30s
    image: ${KOKONUT_ZITADEL_API_IMAGE:-ghcr.io/zitadel/zitadel:v4.19.4@sha256:90a3045b80a2b5b395e1e770302076906af3a5911225af7c464b4f3bd00d0a1b}
    networks:
      kernel: null
      zitadel-data: null
    restart: unless-stopped
    volumes:
      - source: kernel-zitadel-bootstrap
        target: /zitadel/bootstrap
        type: volume
        volume: {}
  zitadel-bootstrap-permissions:
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    entrypoint:
      - /bin/sh
      - /scripts/prepare-bootstrap.sh
    environment:
      KOKONUT_ZITADEL_API_UID: ${KOKONUT_ZITADEL_API_UID:-1000}
      KOKONUT_ZITADEL_LOGIN_GID: ${KOKONUT_ZITADEL_LOGIN_GID:-65533}
    image: ${KOKONUT_ZITADEL_POSTGRES_IMAGE:-postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193}
    network_mode: none
    read_only: true
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    user: '0:0'
    volumes:
      - source: kernel-zitadel-bootstrap
        target: /zitadel/bootstrap
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        read_only: true
        source: ./scripts/zitadel/prepare-bootstrap.sh
        target: /scripts/prepare-bootstrap.sh
        type: bind
  zitadel-db:
    environment:
      KOKONUT_ZITADEL_DATABASE_PASSWORD: ${KOKONUT_ZITADEL_DATABASE_PASSWORD:?Set
        a URL-safe ZITADEL database role secret}
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${KOKONUT_ZITADEL_POSTGRES_ADMIN_PASSWORD:?Set the isolated
        ZITADEL database administrator secret}
      POSTGRES_USER: postgres
    healthcheck:
      interval: 10s
      retries: 8
      start_period: 10s
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U postgres -d postgres
      timeout: 5s
    image: ${KOKONUT_ZITADEL_POSTGRES_IMAGE:-postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193}
    networks:
      zitadel-data: null
    restart: unless-stopped
    volumes:
      - source: kernel-zitadel-postgres-data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        read_only: true
        source: ./scripts/zitadel/init-db.sh
        target: /docker-entrypoint-initdb.d/10-create-zitadel-role.sh
        type: bind
  zitadel-login:
    depends_on:
      zitadel-api:
        condition: service_healthy
        required: true
    environment:
      CUSTOM_REQUEST_HEADERS: Host:${KOKONUT_ZITADEL_DOMAIN:?Set the ZITADEL public
        hostname},X-Forwarded-Proto:https
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_API_URL: http://zitadel-api:8080
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: ${KOKONUT_ZITADEL_LOGIN_COOKIE_SECRET:?Set the
        stable Login V2 cookie secret}
    healthcheck:
      interval: 10s
      retries: 12
      start_period: 30s
      test:
        - CMD
        - /bin/sh
        - -c
        - node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy
      timeout: 30s
    image: ${KOKONUT_ZITADEL_LOGIN_IMAGE:-ghcr.io/zitadel/zitadel-login:v4.19.4@sha256:93ffd1395b827f685ba29c02fa70aee881fc21102519c4e2bbb0b89c0e00f42c}
    networks:
      kernel: null
    restart: unless-stopped
    volumes:
      - read_only: true
        source: kernel-zitadel-bootstrap
        target: /zitadel/bootstrap
        type: volume
        volume: {}
