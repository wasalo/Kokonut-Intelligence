  kernel-caddy-data:
    name: kokonut-kernel-coolify_kernel-caddy-data
  kernel-gateway-audit-spool:
    name: kokonut-kernel-coolify_kernel-gateway-audit-spool
  kernel-postgres-data:
    name: kokonut-kernel-coolify_kernel-postgres-data
  kernel-zitadel-bootstrap:
    name: kokonut-kernel-coolify_kernel-zitadel-bootstrap
  kernel-zitadel-postgres-data:
    name: kokonut-kernel-coolify_kernel-zitadel-postgres-data
