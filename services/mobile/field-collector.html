<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3b2e">
  <title>Kokonut Field Collector</title>
  <style>
    :root { color-scheme: light; --ink:#17332a; --muted:#6c7b75; --green:#0b6b4b; --deep:#0b3b2e; --cream:#f7f5ed; --line:#dce5df; --danger:#a53f35; --shadow:0 12px 30px rgba(23,51,42,.10); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--cream); color:var(--ink); font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }
    .app { max-width:720px; min-height:100vh; margin:auto; background:#fff; }
    header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; padding:16px 18px; color:#fff; background:var(--deep); box-shadow:0 3px 14px rgba(0,0,0,.12); }
    header h1 { flex:1; margin:0; font-size:19px; letter-spacing:.01em; }
    .icon-button { border:0; color:#fff; background:transparent; font-size:22px; padding:4px; }
    .connection { display:flex; align-items:center; gap:6px; font-size:12px; white-space:nowrap; }
    .dot { width:9px; height:9px; border-radius:50%; background:#e2a72a; }
    .dot.online { background:#6ed38f; }
    main { padding:22px 18px 42px; }
    .eyebrow { margin:0 0 5px; color:var(--green); font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    h2 { margin:0 0 7px; font-size:28px; line-height:1.1; }
    .intro { margin:0 0 22px; color:var(--muted); }
    .forms { display:grid; gap:12px; }
    .form-card { display:flex; align-items:center; width:100%; padding:17px; border:1px solid var(--line); border-radius:14px; color:var(--ink); text-align:left; background:#fff; box-shadow:var(--shadow); }
    .form-card:active { transform:translateY(1px); }
    .form-card strong { flex:1; display:block; font-size:17px; }
    .form-card small { display:block; margin-top:3px; color:var(--muted); font-weight:400; }
    .form-mark { width:40px; height:40px; display:grid; place-items:center; margin-right:12px; border-radius:12px; color:#fff; background:var(--green); font-weight:800; }
    .arrow { color:var(--green); font-size:22px; }
    .panel { margin-top:22px; padding:17px; border:1px solid var(--line); border-radius:14px; background:#fbfcfa; }
    .panel-row { display:flex; align-items:center; gap:12px; }
    .panel-row + .panel-row { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
    .panel-row strong { flex:1; }
    .panel-row small { display:block; color:var(--muted); font-size:12px; font-weight:400; }
    .badge { min-width:28px; padding:3px 8px; border-radius:99px; color:#fff; background:var(--green); text-align:center; font-size:13px; font-weight:700; }
    .badge.empty { color:var(--muted); background:#e7eeea; }
    .button { width:100%; border:0; border-radius:10px; padding:13px 16px; color:#fff; background:var(--green); font-weight:750; }
    .button.secondary { color:var(--green); background:#e5f0e9; }
    .button.ghost { color:var(--green); background:transparent; border:1px solid var(--line); }
    .button.danger { color:#fff; background:var(--danger); }
    .button + .button { margin-top:10px; }
    .back { display:inline-flex; gap:6px; align-items:center; margin:0 0 18px; border:0; padding:0; color:var(--green); background:transparent; font-weight:700; }
    form { display:grid; gap:15px; }
    label { display:grid; gap:6px; color:var(--ink); font-size:14px; font-weight:700; }
    input,select,textarea { width:100%; border:1px solid #cddbd3; border-radius:9px; padding:12px; color:var(--ink); background:#fff; }
    textarea { min-height:105px; resize:vertical; }
    input:focus,select:focus,textarea:focus { outline:3px solid rgba(11,107,75,.15); border-color:var(--green); }
    .required::after { content:" *"; color:var(--danger); }
    .capture-row { display:flex; gap:10px; align-items:center; }
    .capture-row .button { width:auto; flex:1; }
    .location { padding:11px 12px; border-radius:9px; color:var(--muted); background:#f0f5f1; font-size:13px; }
    .photo-preview { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .photo-preview img { width:74px; height:74px; border-radius:8px; object-fit:cover; }
    .notice { margin-bottom:16px; padding:12px; border-radius:10px; color:#795d13; background:#fff5d6; font-size:14px; }
    .notice.error { color:#842c25; background:#fde8e5; }
    .queue-item { display:flex; align-items:flex-start; gap:10px; padding:13px 0; border-bottom:1px solid var(--line); }
    .queue-item:last-child { border-bottom:0; }
    .queue-item strong { display:block; }
    .queue-item small { color:var(--muted); }
    .queue-item .remove { margin-left:auto; border:0; color:var(--danger); background:transparent; font-size:13px; }
    .empty { padding:30px 10px; color:var(--muted); text-align:center; }
    .hidden { display:none !important; }
    .footer-note { margin:22px 0 0; color:var(--muted); text-align:center; font-size:12px; }
    @media (min-width:600px) { body { padding:25px 0; } .app { border-radius:18px; overflow:hidden; box-shadow:var(--shadow); } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <button class="icon-button" id="homeButton" aria-label="Home">K</button>
      <h1>Kokonut Field Collector</h1>
      <div class="connection"><span class="dot" id="connectionDot"></span><span id="connectionText">Offline ready</span></div>
    </header>
    <main id="screen"></main>
  </div>
  <script>
    "use strict";
    const STORAGE = { queue:"kokonut_field_queue", device:"kokonut_field_device", forms:"kokonut_field_forms", settings:"kokonut_field_settings" };
    const FALLBACK_FORMS = [
      { form_id:"farm_activity_v1", name:"Farm Activity", description:"Record work completed in the field.", version:"1.0.0", collection_type:"farm_activity", form_schema:{required:["activity_type","activity_date"],properties:{activity_type:{title:"Activity",type:"string",enum:["planting","weeding","irrigation","pruning","spraying","harvesting","transport","storage","other"]},activity_date:{title:"Date",type:"string",format:"date"},description:{title:"Description",type:"string"},labor_hours:{title:"Labor hours",type:"number",minimum:0},notes:{title:"Notes",type:"string",format:"textarea"}}}},
      { form_id:"harvest_v1", name:"Harvest Event", description:"Record harvested quantity and quality.", version:"1.0.0", collection_type:"harvest_event", form_schema:{required:["harvest_date","quantity","unit"],properties:{harvest_date:{title:"Date",type:"string",format:"date"},crop:{title:"Crop",type:"string"},plot:{title:"Plot",type:"string"},quantity:{title:"Quantity",type:"number",minimum:0},unit:{title:"Unit",type:"string",enum:["kg","tonnes","bags","bunches","liters","units"]},quality_grade:{title:"Quality grade",type:"string",enum:["A","B","C","premium","standard","rejected"]},notes:{title:"Notes",type:"string",format:"textarea"}}}},
      { form_id:"expense_v1", name:"Expense", description:"Record a farm expense and receipt.", version:"1.0.0", collection_type:"expense_event", form_schema:{required:["expense_date","category","amount"],properties:{expense_date:{title:"Date",type:"string",format:"date"},category:{title:"Category",type:"string",enum:["seeds","fertilizer","pesticide","labor","equipment","transport","irrigation","processing","packaging","marketing","utilities","rent","other"]},amount:{title:"Amount",type:"number",minimum:0},description:{title:"Description",type:"string"},vendor:{title:"Vendor",type:"string"},notes:{title:"Notes",type:"string",format:"textarea"}}}},
      { form_id:"field_note_v1", name:"Field Note", description:"Capture an observation or issue.", version:"1.0.0", collection_type:"field_note", form_schema:{required:["note_date","content"],properties:{note_date:{title:"Date",type:"string",format:"date"},note_type:{title:"Note type",type:"string",enum:["observation","issue","recommendation","weather","pest","general"]},title:{title:"Title",type:"string"},content:{title:"What did you observe?",type:"string",format:"textarea"},tags:{title:"Tags",type:"string"}}}},
      { form_id:"soil_sample_v1", name:"Soil Sample", description:"Record a soil sample and measurements.", version:"1.0.0", collection_type:"soil_sample", form_schema:{required:["sample_date"],properties:{sample_date:{title:"Date",type:"string",format:"date"},depth_cm:{title:"Depth (cm)",type:"number",minimum:0},depth_layer:{title:"Depth layer",type:"string",enum:["topsoil","subsoil","root_zone"]},ph:{title:"pH",type:"number",minimum:0,maximum:14},organic_matter_pct:{title:"Organic matter (%)",type:"number",minimum:0,maximum:100},texture:{title:"Texture",type:"string",enum:["sandy","loamy","clay","silty"]},moisture_pct:{title:"Moisture (%)",type:"number",minimum:0,maximum:100},notes:{title:"Notes",type:"string",format:"textarea"}}}}
    ];
    let screen = document.getElementById("screen");
    let currentForm = null;
    let currentLocation = null;
    let currentPhotos = [];

    const read = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (_) { return fallback; } };
    const write = (key, value) => localStorage.setItem(key, JSON.stringify(value));
    const settings = () => read(STORAGE.settings, { apiBase:"", locationId:"", userId:"", deviceName:"" });
    const queue = () => read(STORAGE.queue, []);
    const forms = () => read(STORAGE.forms, FALLBACK_FORMS);
    const uid = () => (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);
    const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
    const today = () => new Date().toISOString().slice(0,10);
    const apiBase = () => {
      const configured = settings().apiBase.trim().replace(/\/$/, "");
      if (configured) return configured.replace(/\/api\/mobile$/, "") + "/api/mobile";
      return location.protocol === "file:" ? "" : `${location.origin}/api/mobile`;
    };
    const setConnection = () => {
      const online = navigator.onLine;
      document.getElementById("connectionDot").classList.toggle("online", online);
      document.getElementById("connectionText").textContent = online ? "Online" : "Offline ready";
    };
    const notify = (message, error = false) => {
      const existing = document.querySelector(".notice");
      if (existing) existing.remove();
      const node = document.createElement("div");
      node.className = `notice${error ? " error" : ""}`;
      node.textContent = message;
      screen.prepend(node);
      window.setTimeout(() => node.remove(), 4500);
    };
    const captureGps = () => {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(position => {
        currentLocation = { latitude: position.coords.latitude, longitude: position.coords.longitude, accuracy_m: position.coords.accuracy };
        const node = document.getElementById("locationValue");
        if (node) node.textContent = `${currentLocation.latitude.toFixed(5)}, ${currentLocation.longitude.toFixed(5)} (accuracy ${Math.round(currentLocation.accuracy_m)}m)`;
      }, () => {}, { enableHighAccuracy:true, timeout:10000, maximumAge:30000 });
    };
    const renderHome = () => {
      currentForm = null;
      const items = forms().map((form, index) => `<button class="form-card" data-form="${esc(form.form_id)}"><span class="form-mark">${index + 1}</span><span><strong>${esc(form.name)}</strong><small>${esc(form.description || "Field record")}</small></span><span class="arrow">&rsaquo;</span></button>`).join("");
      const count = queue().length;
      screen.innerHTML = `<p class="eyebrow">Offline-first field records</p><h2>Collect what the field knows.</h2><p class="intro">Save observations now. The app will upload them when a connection returns.</p><div class="forms">${items}</div><section class="panel"><div class="panel-row"><strong>Pending records<small>${count ? "Waiting to sync" : "Everything is up to date"}</small></strong><span class="badge ${count ? "" : "empty"}">${count}</span></div><div class="panel-row"><strong>Device setup<small>${settings().locationId ? "Location configured" : "Add a location in settings"}</small></strong><button class="button secondary" style="width:auto" id="settingsButton">Open</button></div><div class="panel-row"><strong>Sync queue<small>Upload saved records when online</small></strong><button class="button" style="width:auto" id="syncButton">Sync now</button></div></section><p class="footer-note">Kokonut Intelligence Field Collector v1.0.0</p>`;
      document.querySelectorAll("[data-form]").forEach(button => button.addEventListener("click", () => renderForm(forms().find(form => form.form_id === button.dataset.form))));
      document.getElementById("settingsButton").addEventListener("click", renderSettings);
      document.getElementById("syncButton").addEventListener("click", () => syncQueue(true));
    };
    const renderField = (name, definition, required) => {
      const label = `${esc(definition.title || name.replaceAll("_", " "))}`;
      const requiredClass = required ? " required" : "";
      if (Array.isArray(definition.enum)) return `<label class="${requiredClass}">${label}<select name="${esc(name)}" ${required ? "required" : ""}><option value="">Choose...</option>${definition.enum.map(value => `<option value="${esc(value)}">${esc(value)}</option>`).join("")}</select></label>`;
      const type = definition.format === "date" ? "date" : definition.type === "number" ? "number" : "text";
      const extra = `${definition.minimum !== undefined ? ` min="${definition.minimum}"` : ""}${definition.maximum !== undefined ? ` max="${definition.maximum}"` : ""}${definition.format === "textarea" ? "" : ""}`;
      if (definition.format === "textarea") return `<label class="${requiredClass}">${label}<textarea name="${esc(name)}" ${required ? "required" : ""}></textarea></label>`;
      return `<label class="${requiredClass}">${label}<input type="${type}" name="${esc(name)}"${extra} ${required ? "required" : ""}></label>`;
    };
    const renderForm = form => {
      if (!form) return renderHome();
      currentForm = form; currentLocation = null; currentPhotos = [];
      const schema = form.form_schema || {};
      const required = schema.required || [];
      const fields = Object.entries(schema.properties || {}).map(([name, definition]) => renderField(name, definition, required.includes(name))).join("");
      screen.innerHTML = `<button class="back" id="backButton">&lsaquo; Back to forms</button><p class="eyebrow">${esc(form.collection_type)}</p><h2>${esc(form.name)}</h2><p class="intro">${esc(form.description || "Record a field observation.")}</p><form id="collectionForm">${fields}<div><div class="capture-row"><button type="button" class="button secondary" id="photoButton">Add photo</button><button type="button" class="button ghost" id="gpsButton">Refresh GPS</button></div><input class="hidden" type="file" accept="image/*" capture="environment" id="photoInput"><div class="photo-preview" id="photoPreview"></div></div><div class="location" id="locationValue">GPS not captured yet. Tap Refresh GPS or allow location access.</div><button class="button" type="submit">Save record</button></form>`;
      document.getElementById("backButton").addEventListener("click", renderHome);
      document.getElementById("gpsButton").addEventListener("click", captureGps);
      document.getElementById("photoButton").addEventListener("click", () => document.getElementById("photoInput").click());
      document.getElementById("photoInput").addEventListener("change", event => readPhoto(event.target.files[0]));
      document.getElementById("collectionForm").addEventListener("submit", saveRecord);
      captureGps();
    };
    const readPhoto = file => {
      if (!file) return;
      if (file.size > 2_000_000) return notify("Please choose a photo smaller than 2 MB.", true);
      const reader = new FileReader();
      reader.onload = () => {
        const image = new Image();
        image.onload = () => {
          const scale = Math.min(1, 1280 / Math.max(image.naturalWidth, image.naturalHeight));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
          currentPhotos.push({ name:file.name, data:canvas.toDataURL("image/jpeg", .75) });
          document.getElementById("photoPreview").innerHTML = currentPhotos.map(photo => `<img src="${photo.data}" alt="${esc(photo.name)}">`).join("");
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    };
    const saveRecord = event => {
      event.preventDefault();
      const formData = new FormData(event.target); const payload = {};
      for (const [key, value] of formData.entries()) payload[key] = value === "" ? null : (event.target.elements[key].type === "number" ? Number(value) : value);
      payload.photos = currentPhotos.map(photo => photo.data);
      const item = { client_id:uid(), collection_type:currentForm.collection_type, form_id:currentForm.form_id, form_version:currentForm.version || "1.0.0", payload, photo_refs:currentPhotos.map(photo => photo.name), ...currentLocation, collected_at:new Date().toISOString(), sync_status:"pending" };
      const items = queue(); items.push(item);
      try { write(STORAGE.queue, items); renderHome(); notify("Saved on this device. It will sync when online."); syncQueue(false); } catch (_) { notify("Storage is full. Remove older queued records first.", true); }
    };
    const ensureDevice = async () => {
      const base = apiBase(); if (!base) throw new Error("Set the API URL in Settings before syncing.");
      let device = read(STORAGE.device, null); if (device && device.device_token) return device;
      const config = settings();
      const response = await fetch(`${base}/register`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ device_id:device?.device_id || `browser-${uid()}`, device_name:config.deviceName || "Field browser", user_id:config.userId || null, location_id:config.locationId || null, app_version:"1.0.0", os:navigator.platform }) });
      if (!response.ok) throw new Error(`Device registration failed (${response.status})`);
      device = await response.json(); write(STORAGE.device, device); return device;
    };
    const syncQueue = async manual => {
      if (!navigator.onLine) { if (manual) notify("You are offline. Records remain safely on this device."); return; }
      const items = queue(); if (!items.length) { if (manual) notify("Nothing is waiting to sync."); return; }
      try {
        const device = await ensureDevice(); const base = apiBase();
        const response = await fetch(`${base}/sync`, { method:"POST", headers:{"Content-Type":"application/json","X-Device-Token":device.device_token}, body:JSON.stringify({ device_id:device.device_id, collections:items.map(item => ({ client_id:item.client_id, collection_type:item.collection_type, form_id:item.form_id, form_version:item.form_version, payload:item.payload, photo_refs:item.photo_refs, latitude:item.latitude, longitude:item.longitude, accuracy_m:item.accuracy_m, collected_at:item.collected_at })) }) });
        if (!response.ok) throw new Error(`Sync failed (${response.status})`);
        const result = await response.json(); const accepted = Number(result.accepted || 0); const acceptedIds = new Set(result.accepted_client_ids || []); const duplicateIds = new Set(result.duplicate_client_ids || []); const remaining = items.filter(item => !acceptedIds.has(item.client_id) && !duplicateIds.has(item.client_id));
        write(STORAGE.queue, remaining); write(STORAGE.settings, {...settings(), lastSyncAt:new Date().toISOString()});
        if (manual) { renderHome(); notify(`${accepted} record${accepted === 1 ? "" : "s"} uploaded.`); }
      } catch (error) { if (manual) notify(error.message || "Sync unavailable. Records remain queued.", true); }
    };
    const renderQueue = () => { const items = queue(); screen.innerHTML = `<button class="back" id="backButton">&lsaquo; Back to home</button><p class="eyebrow">Local queue</p><h2>${items.length} pending</h2><p class="intro">These records are stored in this browser until the server accepts them.</p>${items.length ? `<div class="panel">${items.map((item, index) => `<div class="queue-item"><span class="badge">${index + 1}</span><div><strong>${esc(item.collection_type)}</strong><small>${new Date(item.collected_at).toLocaleString()}${item.latitude ? ` | GPS ${Number(item.latitude).toFixed(4)}, ${Number(item.longitude).toFixed(4)}` : ""}</small></div><button class="remove" data-remove="${esc(item.client_id)}">Remove</button></div>`).join("")}</div><button class="button" id="syncButton">Sync now</button>` : `<div class="empty">No pending records.</div>`}`; document.getElementById("backButton").addEventListener("click", renderHome); document.querySelectorAll("[data-remove]").forEach(button => button.addEventListener("click", () => { write(STORAGE.queue, queue().filter(item => item.client_id !== button.dataset.remove)); renderQueue(); })); const sync = document.getElementById("syncButton"); if (sync) sync.addEventListener("click", () => syncQueue(true)); };
    const renderSettings = () => { const config = settings(); screen.innerHTML = `<button class="back" id="backButton">&lsaquo; Back to home</button><p class="eyebrow">Device setup</p><h2>Settings</h2><p class="intro">The app can collect offline without these values. Add them to enable automatic sync.</p><form id="settingsForm"><label>API URL<input name="apiBase" value="${esc(config.apiBase)}" placeholder="https://data.example.org"></label><label>Location ID<input name="locationId" value="${esc(config.locationId)}" placeholder="Location UUID"></label><label>Worker ID<input name="userId" value="${esc(config.userId)}" placeholder="Your name or staff ID"></label><label>Device name<input name="deviceName" value="${esc(config.deviceName)}" placeholder="Field phone 1"></label><button class="button" type="submit">Save settings and register</button></form><button class="button ghost" id="queueButton">View pending queue</button>`; document.getElementById("backButton").addEventListener("click", renderHome); document.getElementById("queueButton").addEventListener("click", renderQueue); document.getElementById("settingsForm").addEventListener("submit", async event => { event.preventDefault(); const values = Object.fromEntries(new FormData(event.target).entries()); write(STORAGE.settings, values); localStorage.removeItem(STORAGE.device); if (navigator.onLine && values.apiBase) { try { await ensureDevice(); notify("Settings saved and device registered."); } catch (error) { notify(error.message, true); } } else notify("Settings saved. Registration will happen when online."); }); };
    const loadForms = async () => { const base = apiBase(); if (!base || !navigator.onLine) return; try { const response = await fetch(`${base}/forms?location_id=${encodeURIComponent(settings().locationId || "")}`); if (response.ok) { const fetched = (await response.json()).forms || []; if (fetched.length) write(STORAGE.forms, fetched); } } catch (_) {} };
    document.getElementById("homeButton").addEventListener("click", renderHome);
    window.addEventListener("online", () => { setConnection(); loadForms().then(() => syncQueue(false)); });
    window.addEventListener("offline", setConnection);
    setConnection(); renderHome(); loadForms().then(() => renderHome());
    window.setInterval(() => syncQueue(false), 30000);
  </script>
</body>
</html>
