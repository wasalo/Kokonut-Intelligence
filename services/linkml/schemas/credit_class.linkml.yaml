id: https://kokonut.network/linkml/credit_class
name: CreditClass
title: Kokonut Credit Class
version: "3.0.0"
description: >-
  Standardized metadata schema for credit class definitions, aligned with
  Regen Network Framework Working Group CreditClassInfo schema and
  schema.org standards.

imports:
  - linkml:types
  - core

prefixes:
  kokonut: https://kokonut.network/ontology#
  schema: http://schema.org/
  cids: https://ontology.commonapproach.org/cids#
  qudt: http://qudt.org/schema/qudt/
  rfs: https://framework.regen.network/schema/

default_prefix: schema
default_range: string

classes:
  CreditClass:
    description: A credit class defining methodology and protocol for ecological crediting
    slots:
      - name
      - description
      - url
      - same_as
    slot_usage:
      name:
        required: true
      url:
        range: uri
    attributes:
      hasPrimaryImpact:
        slot_uri: rfs:hasPrimaryImpact
        description: The primary impact expected from adhering to the protocol.
        range: Impact
        required: true
      hasCoBenefits:
        slot_uri: rfs:hasCoBenefits
        description: Co-benefits are any secondary impacts.
        range: Impact
        multivalued: true
        inlined_as_list: true
      hasSourceRegistry:
        slot_uri: rfs:hasSourceRegistry
        description: The registry where the credits are originally issued.
        range: Registry
        inlined: true
      managedUnderProgram:
        slot_uri: rfs:managedUnderProgram
        description: The higher-level rules and requirements.
        range: CreditingProgram
        recommended: true
        inlined: true
      hasCreditProtocol:
        slot_uri: rfs:hasCreditProtocol
        description: The root document of the credit protocol.
        range: CreditProtocol
        recommended: true
        multivalued: true
        inlined_as_list: true
      hasApprovedMethodologies:
        slot_uri: rfs:hasApprovedMethodologies
        description: Standalone methodologies for quantifying GHG or other benefits.
        range: Methodology
        multivalued: true
        inlined_as_list: true
      hasCreditingPeriod:
        slot_uri: rfs:hasCreditingPeriod
        description: The total duration of the crediting term for the project.
        range: duration
      eligibleEnvironmentTypes:
        slot_uri: rfs:eligibleEnvironmentTypes
        description: Types of environments that a project registered under this credit class may focuses on.
        range: EnvironmentType
        required: true
        multivalued: true
      eligibleActivities:
        slot_uri: rfs:eligibleActivities
        description: Eligible activities for projects registered under this credit class.
        range: ActivityType
        required: true
        multivalued: true
      hasBufferPoolAccounts:
        slot_uri: rfs:hasBufferPoolAccounts
        description: Buffer pool accounts associated with the credit class.
        range: BufferPoolAccount
        multivalued: true
        inlined_as_list: true
      methodology:
        range: string
        description: Name of the methodology
      methodology_version:
        range: string
      methodology_ref:
        slot_uri: schema:url
        range: uri
      credit_type:
        range: string
        required: true
        permissible_values:
          carbon:
          biodiversity:
          water:
          soil:
          mixed:
      admin_address:
        slot_uri: rfs:adminAddress
        range: string
        description: The admin of the credit class.
      ecosystem_types:
        range: string
        multivalued: true
        required: true
      eligible_activities:
        range: string
        multivalued: true
        required: true
      crediting_period_years:
        range: integer
        description: Maximum crediting period in years
      credit_generation_method:
        range: string
        permissible_values:
          avoided_emissions:
          carbon_dioxide_removal:
          emissions_reduction:
      permanence_period:
        range: duration
        description: Permanence period of the credits (ISO 8601)
      has_permanence:
        range: boolean
        description: Whether permanence tracking is required
      registry_slug:
        range: string
      governance_mechanism:
        range: string
      allowlist_required:
        range: boolean
      primary_impact_type:
        range: string
      primary_impact_name:
        range: string
      primary_impact_sdgs:
        range: integer
        multivalued: true
