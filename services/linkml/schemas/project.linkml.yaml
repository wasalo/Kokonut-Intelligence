id: https://kokonut.network/linkml/project
name: Project
title: Kokonut Project
version: "3.0.0"
description: >-
  Standardized metadata schema for farm/project definitions, aligned with
  Regen Network Framework Working Group ProjectInfo schema and schema.org.

imports:
  - linkml:types
  - core

prefixes:
  kokonut: https://kokonut.network/ontology#
  schema: http://schema.org/
  geojson: https://purl.org/geojson/vocab#
  qudt: http://qudt.org/schema/qudt/
  rfs: https://framework.regen.network/schema/

default_prefix: schema
default_range: string

classes:
  Project:
    description: A Kokonut farm project
    slots:
      - name
      - description
      - url
      - same_as
      - main_entity_of_page
    slot_usage:
      name:
        required: true
      url:
        range: uri
    attributes:
      hasLinks:
        slot_uri: rfs:hasLinks
        description: Links associated with the project.
        range: Link
        multivalued: true
        inlined: true
        inlined_as_list: true
      hasReferenceId:
        slot_uri: rfs:hasReferenceId
        description: External reference IDs associated with the project.
        range: ReferenceId
        multivalued: true
        inlined: true
        inlined_as_list: true
      hasFeature:
        slot_uri: rfs:hasFeature
        description: The location of the project.
        range: Feature
        required: true
      projectSize:
        slot_uri: rfs:projectSize
        description: Size of the project area.
        range: QuantitativeValue
      environmentType:
        slot_uri: rfs:environmentType
        description: The environment type of the project.
        range: EnvironmentType
        multivalued: true
      region:
        slot_uri: rfs:region
        description: The region associated with the project.
      bioregion:
        slot_uri: rfs:bioregion
        description: The bioregion associated with the project.
        multivalued: true
      biomeType:
        slot_uri: rfs:biomeType
        description: The type of biome associated with the project.
        multivalued: true
      watershed:
        slot_uri: rfs:watershed
        description: The watershed associated with the project.
      subWatershed:
        slot_uri: rfs:subWatershed
        description: The sub-watershed associated with the project.
      activity:
        slot_uri: rfs:activity
        description: The types of activities being implemented in projects
        range: ActivityType
        multivalued: true
      hasPrimaryImpact:
        slot_uri: rfs:hasPrimaryImpact
        description: The primary impact expected.
        range: Impact
        required: true
        inlined: true
      hasCoBenefits:
        slot_uri: rfs:hasCoBenefits
        description: Co-benefits are any secondary impacts.
        range: Impact
        multivalued: true
        inlined: true
        inlined_as_list: true
      hasProjectDeveloper:
        slot_uri: rfs:hasProjectDeveloper
        description: The organization responsible for developing the project.
        range: Entity
      hasProjectMonitor:
        slot_uri: rfs:hasProjectMonitor
        description: The organization responsible for monitoring.
        range: Entity
      hasProjectOperator:
        slot_uri: rfs:hasProjectOperator
        description: The organization responsible for operating.
        range: Entity
      hasProjectOwner:
        slot_uri: rfs:hasProjectOwner
        description: The organization that owns the project.
        range: Entity
      hasProjectPartner:
        slot_uri: rfs:hasProjectPartner
        description: Partner organization.
        range: Entity
      hasProjectVerifier:
        slot_uri: rfs:hasProjectVerifier
        description: The organization responsible for verification.
        range: Entity
      usesMethodology:
        slot_uri: rfs:usesMethodology
        description: The methodology that the project uses.
        range: Methodology
        multivalued: true
        inlined: true
        inlined_as_list: true
      projectStartDate:
        slot_uri: schema:startDate
        description: The start date of the project.
        range: date
      projectEndDate:
        slot_uri: schema:endDate
        description: The end date of the project.
        range: date
