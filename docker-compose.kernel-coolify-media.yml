# Coolify application environment variables are shared at the Compose-resource
# level. Keep media credentials out of that shared environment. Raw Compose
# mounts this host-managed file into the Gateway only.
services:
  app:
    environment:
      MOBILE_MEDIA_PROVIDER: ""
      MOBILE_MEDIA_LOCAL_DIRECTORY: ""
      MOBILE_MEDIA_LOCAL_KEY: ""
      MOBILE_MEDIA_ENCRYPTION_KEY: ""
      MOBILE_MEDIA_S3_ENDPOINT: ""
      MOBILE_MEDIA_S3_BUCKET: ""
      MOBILE_MEDIA_S3_ACCESS_KEY_ID: ""
      MOBILE_MEDIA_S3_SECRET_ACCESS_KEY: ""
      MOBILE_MEDIA_S3_REGION: ""
      KOKONUT_API_MEDIA_CONFIG_FILE: /run/kokonut/private-media.env
    volumes:
      - type: bind
        source: /data/coolify/applications/${COOLIFY_RESOURCE_UUID:?Coolify resource UUID is required}/private/media.env
        target: /run/kokonut/private-media.env
        read_only: true
