# Explicit opt-in: apply migrations 747/748 and provision the login first.
# Append after Standard/runtime-role manifests. No API credentials are changed.
services:
  app:
    environment:
      # The endpoint stays closed in the default Standard profile.
      KOKONUT_FEATURE_AUTHENTICATED_SYNTHESIS_DISPATCH: "true"
  runtime-role-bootstrap:
    environment:
      KOKONUT_SCHEDULER_PASSWORD: ${KOKONUT_SCHEDULER_PASSWORD:?dedicated scheduler password required}
  worker:
    environment:
      PG_USER: kokonut_scheduler_login
      PG_PASSWORD: ${KOKONUT_SCHEDULER_PASSWORD:?dedicated scheduler password required}
      KOKONUT_SCHEDULER_DATABASE_URL: ${KOKONUT_SCHEDULER_DATABASE_URL:?dedicated scheduler DSN required}
      KOKONUT_RUNTIME_PARENT_ROLE: ""
      # The isolated scheduler may dispatch only registered synthesis task
      # commands. Child environment filtering forwards exactly the credential
      # selected by --task-key; the scheduler receives no shared DB fallback.
      KOKONUT_AGENT_SUMMARY_DETERMINISTIC_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_SUMMARY_DETERMINISTIC_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_SUMMARY_DETERMINISTIC_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_SUMMARY_DETERMINISTIC_SOURCE_WORKER_CREDENTIAL:-}
      KOKONUT_AGENT_ORGANIC_READINESS_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_ORGANIC_READINESS_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_ORGANIC_READINESS_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_ORGANIC_READINESS_SOURCE_WORKER_CREDENTIAL:-}
      KOKONUT_AGENT_ECOLOGICAL_MODELING_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_ECOLOGICAL_MODELING_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_ECOLOGICAL_MODELING_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_ECOLOGICAL_MODELING_SOURCE_WORKER_CREDENTIAL:-}
      KOKONUT_AGENT_HOLISTIC_WELLBEING_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_HOLISTIC_WELLBEING_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_HOLISTIC_WELLBEING_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_HOLISTIC_WELLBEING_SOURCE_WORKER_CREDENTIAL:-}
      KOKONUT_AGENT_FEEDBACK_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_FEEDBACK_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_FEEDBACK_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_FEEDBACK_SOURCE_WORKER_CREDENTIAL:-}
      KOKONUT_AGENT_COMMONS_LIBERATION_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_COMMONS_LIBERATION_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_COMMONS_LIBERATION_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_COMMONS_LIBERATION_SOURCE_WORKER_CREDENTIAL:-}
      KOKONUT_AGENT_GNH_ALIGNMENT_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_GNH_ALIGNMENT_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_GNH_ALIGNMENT_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_GNH_ALIGNMENT_SOURCE_WORKER_CREDENTIAL:-}
      KOKONUT_AGENT_REGENERATOR_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_REGENERATOR_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_REGENERATOR_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_REGENERATOR_SOURCE_WORKER_CREDENTIAL:-}
      KOKONUT_AGENT_CAPITAL_EFFICIENCY_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_CAPITAL_EFFICIENCY_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_CAPITAL_EFFICIENCY_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_CAPITAL_EFFICIENCY_SOURCE_WORKER_CREDENTIAL:-}
      KOKONUT_AGENT_FINANCIAL_RESILIENCE_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_FINANCIAL_RESILIENCE_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_FINANCIAL_RESILIENCE_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_FINANCIAL_RESILIENCE_SOURCE_WORKER_CREDENTIAL:-}
      KOKONUT_AGENT_BIO_FACTORY_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_BIO_FACTORY_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_BIO_FACTORY_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_BIO_FACTORY_SOURCE_WORKER_CREDENTIAL:-}
      KOKONUT_AGENT_OPEN_SOURCE_CAPITALIST_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_OPEN_SOURCE_CAPITALIST_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_OPEN_SOURCE_CAPITALIST_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_OPEN_SOURCE_CAPITALIST_SOURCE_WORKER_CREDENTIAL:-}
      KOKONUT_AGENT_KOKONUT_COMMONS_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_KOKONUT_COMMONS_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_KOKONUT_COMMONS_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_KOKONUT_COMMONS_SOURCE_WORKER_CREDENTIAL:-}
