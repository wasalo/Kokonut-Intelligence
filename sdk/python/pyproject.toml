[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kokonut-intelligence"
version = "0.1.0"
description = "Python SDK for Kokonut Intelligence Platform"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
clickhouse = ["clickhouse-connect>=0.7.0"]
web3 = ["web3>=7.16.0"]
grpc = ["grpcio>=1.68.1,<2.0.0", "protobuf>=5.29.1,<6.0.0"]
grpc-codegen = ["grpcio-tools==1.68.1", "protobuf==5.29.1"]
all = [
    "requests>=2.28.0",
    "clickhouse-connect>=0.7.0",
    "web3>=7.16.0",
    "grpcio>=1.68.1,<2.0.0",
    "protobuf>=5.29.1,<6.0.0",
]

[project.urls]
Homepage = "https://kokonut.network"
Repository = "https://github.com/wasalo/Kokonut-Intelligence"

[tool.setuptools.packages.find]
where = ["."]
include = ["kokonut*"]

[tool.setuptools.package-data]
kokonut = ["py.typed"]
