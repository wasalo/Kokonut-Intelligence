# Optional least-privilege app credentials. Combine after the candidate and any
# selected Kernel overlays. The one-shot admin service is enabled only for the
# explicit runtime-admin profile and is run with `docker compose run --rm`.
services:
  runtime-role-bootstrap:
    profiles: [runtime-admin]
    build:
      context: .
      dockerfile: Dockerfile.kernel
      target: kernel
      args:
        KOKONUT_CLICKHOUSE: "false"
    restart: "no"
    command: ["python3", "-m", "services.migration.runtime_role"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      PG_HOST: database
      PG_PORT: "5432"
      PG_DB: kokonut_intelligence
      KOKONUT_DB_ADMIN_USER: ${KOKONUT_DB_ADMIN_USER:-kokonut}
      KOKONUT_DB_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      KOKONUT_RUNTIME_USER: ${KOKONUT_RUNTIME_USER:-kokonut_runtime}
      KOKONUT_RUNTIME_PASSWORD: ${KOKONUT_RUNTIME_PASSWORD:?KOKONUT_RUNTIME_PASSWORD must be set}
      KOKONUT_OPERATOR_AUTH_USER: ${KOKONUT_OPERATOR_AUTH_USER:-kokonut_operator_auth}
      KOKONUT_OPERATOR_AUTH_PASSWORD: ${KOKONUT_OPERATOR_AUTH_PASSWORD:?KOKONUT_OPERATOR_AUTH_PASSWORD must be set}
      KOKONUT_NOTIFICATION_ENQUEUE_USER: ${KOKONUT_NOTIFICATION_ENQUEUE_USER:-kokonut_notification_enqueue_login}
      KOKONUT_NOTIFICATION_ENQUEUE_PASSWORD: ${KOKONUT_NOTIFICATION_ENQUEUE_PASSWORD:-}
      KOKONUT_MARKET_DATA_USER: ${KOKONUT_MARKET_DATA_USER:-kokonut_market_data_login}
      KOKONUT_MARKET_DATA_PASSWORD: ${KOKONUT_MARKET_DATA_PASSWORD:-}
      KOKONUT_SENSOR_INGESTION_USER: ${KOKONUT_SENSOR_INGESTION_USER:-kokonut_sensor_ingestion_login}
      KOKONUT_SENSOR_INGESTION_PASSWORD: ${KOKONUT_SENSOR_INGESTION_PASSWORD:-}
    networks:
      - kernel

  app:
    environment:
      PG_USER: ${KOKONUT_RUNTIME_USER:-kokonut_runtime}
      PG_PASSWORD: ${KOKONUT_RUNTIME_PASSWORD:?KOKONUT_RUNTIME_PASSWORD must be set}
      KOKONUT_OPERATOR_AUTH_USER: ${KOKONUT_OPERATOR_AUTH_USER:-kokonut_operator_auth}
      KOKONUT_OPERATOR_AUTH_PASSWORD: ${KOKONUT_OPERATOR_AUTH_PASSWORD:?KOKONUT_OPERATOR_AUTH_PASSWORD must be set}
