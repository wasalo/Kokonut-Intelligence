version: 52
jobs:
- name: ci
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    cloneDepth: 1
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: command
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: bash
      commands: |
        set -e
        export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH
        # Install docker compose plugin if missing (persists on host after first build).
        if ! docker compose version >/dev/null 2>&1; then
          echo "Installing docker compose plugin..."
          mkdir -p /usr/libexec/docker/cli-plugins
          curl -sSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64" \
            -o /usr/libexec/docker/cli-plugins/docker-compose
          chmod +x /usr/libexec/docker/cli-plugins/docker-compose
        fi
        docker --version; docker compose version
        # Ephemeral .env from OneDev job secrets (read by compose and load_dotenv).
        printf 'POSTGRES_PASSWORD=%s\nCLICKHOUSE_PASSWORD=%s\nMETABASE_EMBEDDING_SECRET_KEY=%s\nDIRECTUS_SECRET=ci-placeholder-secret\nADMIN_PASSWORD=ci-admin-password\nADMIN_EMAIL=ci@@kokonut.network\n' '@secrets:postgres-password@' '@secrets:clickhouse-password@' '@secrets:metabase-embedding-secret@' > .env
        # Start databases on the host (CI override publishes to 127.0.0.1).
        docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d database clickhouse
        # Wait for PostgreSQL to accept connections.
        for i in $(seq 1 30); do
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T database pg_isready -q && break
          sleep 1
        done
        docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T database pg_isready -q
        rm -f .env.sops
        ./scripts/seed.sh
        # Isolate Python deps (host Python 3.11+).
        apt-get update -qq && apt-get install -y -qq python3-venv python3-dev libpq-dev gcc >/dev/null 2>&1 || true
        python3 -m venv .venv
        . .venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        python scripts/check-python-runtime.py
        python -c 'import fastapi; from fastapi.testclient import TestClient; print(f"FastAPI {fastapi.__version__}")'
        export PG_HOST=localhost PG_PORT=5432 CH_HOST=localhost CH_PORT=8123
        export KOKONUT_METRICS_EXECUTION=host
        ./scripts/ci-check.sh
        ./scripts/verify-full-test-suite.sh
    useTTY: false
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone
  - type: PullRequestUpdateTrigger
    branches: main
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
