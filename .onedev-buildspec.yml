version: 52
jobs:
- name: ci
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    cloneDepth: 1
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: command
    # PRs execute repository-controlled scripts. Keep the build inside the
    # OneDev build container rather than on the agent host.
    runInContainer: true
    runAs: root
    image: ubuntu:24.04
    interpreter:
      type: PosixInterpreter
      shell: bash
      commands: |
        set -euo pipefail
        export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH
        # The isolated runner must provide Docker; never install unverified
        # binaries or modify the build agent from a PR.
        command -v docker >/dev/null
        docker compose version >/dev/null
        docker --version; docker compose version
        # PR builds use disposable test credentials, never deployment secrets.
        umask 077
        trap 'rm -f .env' EXIT
        printf 'POSTGRES_PASSWORD=%s\nCLICKHOUSE_PASSWORD=%s\nREDIS_PASSWORD=%s\nMETABASE_EMBEDDING_SECRET_KEY=%s\nDIRECTUS_SECRET=%s\nADMIN_PASSWORD=%s\nADMIN_EMAIL=ci@@kokonut.network\nPUBLIC_URL=http://localhost:8055\n' \
          "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" \
          "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 24)" > .env
        # Start the services required by database-backed and Directus tests.
        docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d database clickhouse cache directus
        # Wait for PostgreSQL to accept connections.
        for i in $(seq 1 30); do
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T database pg_isready -q && break
          sleep 1
        done
        docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T database pg_isready -q
        for i in $(seq 1 60); do
          curl --fail --silent http://127.0.0.1:8055/server/ping >/dev/null && break
          if [ "$i" -eq 60 ]; then
            docker compose -f docker-compose.yml -f docker-compose.ci.yml logs directus
            exit 1
          fi
          sleep 2
        done
        rm -f .env.sops
        ./scripts/seed.sh
        ./scripts/seed-pilot.sh
        # Isolate Python deps (host Python 3.11+).
        apt-get update -qq && apt-get install -y -qq openssl python3-venv python3-dev libpq-dev gcc >/dev/null
        python3 -m venv .venv
        . .venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        python scripts/check-python-runtime.py
        python -c 'import fastapi; from fastapi.testclient import TestClient; print(f"FastAPI {fastapi.__version__}")'
        # The SDK generation/build steps require Node.js and npm on the host.
        apt-get install -y -qq nodejs npm >/dev/null
        node --version
        npm --version
        export PG_HOST=localhost PG_PORT=5432 CH_HOST=localhost CH_PORT=8123
        export KOKONUT_METRICS_EXECUTION=host
        ./scripts/check-er-model.sh
        (cd sdk/typescript && npm install --no-audit --no-fund && npm run generate && npm run build)
        ./scripts/ci-check.sh
        ./scripts/verify-full-test-suite.sh
        # Static analysis gate (F-15)
        pip install slither-analyzer semgrep
        curl -L https://github.com/Cyfrin/aderyn/releases/latest/download/aderyn-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin
        slither contracts --filter-paths "lib/|node_modules/" --json /tmp/slither-results.json || true
        aderyn contracts --output /tmp/aderyn-report.md || true
        echo "Static analysis complete"
    useTTY: false
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone
  - type: PullRequestUpdateTrigger
    branches: main
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
