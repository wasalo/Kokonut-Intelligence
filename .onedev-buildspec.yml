version: 1
jobs:
- name: ci
  cloneCredential: !DefaultCredential {}
  retrieveSource: true
  triggers:
  - !BranchUpdateTrigger
    branches: main
  - !PullRequestUpdateTrigger
    branches: main
  cpuRequirement: 1000m
  memoryRequirement: 2048m
  timeout: 3600
  caches:
  - key: pip-cache
    path: ~/.cache/pip
  steps:
  - !CheckoutStep
    name: checkout
    cloneDepth: 1
  - !CommandStep
    name: focused-ci
    interpreter: !DefaultInterpreter
      commands: |
        set -e
        # Materialize an ephemeral, gitignored .env from OneDev job secrets.
        # docker compose and seed.sh read these; the CI override publishes
        # PostgreSQL/ClickHouse to 127.0.0.1 so host-run pytest can reach them.
        cat > .env <<'ENV'
        POSTGRES_PASSWORD=@secrets:postgres-password@
        CLICKHOUSE_PASSWORD=@secrets:clickhouse-password@
        METABASE_EMBEDDING_SECRET_KEY=@secrets:metabase-embedding-secret@
        ENV
        # Install Python dependencies (cached across builds).
        pip install -r requirements.txt
        # Bring up PostgreSQL + ClickHouse (CI override publishes to 127.0.0.1).
        docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d database clickhouse
        # Apply base schema + seeds (uses docker compose exec into the database service).
        ./scripts/seed.sh
        # --- Focused CI subset: imports + metric calculators + heartland durability ---
        # (Phase 2 will expand to the full scripts/ci-check.sh 8-group suite.)
        python3 -c 'import services.ingestion.base, services.metrics.calculators, services.agents.safety'
        python3 -m tests.test_metrics
        PG_HOST=localhost PG_PORT=5432 python3 -m pytest \
          tests/test_migration.py tests/test_gateway_auth.py tests/test_scheduler_durability.py \
          tests/test_event_bus_durability.py tests/test_carbon_credits.py tests/test_threatcasting.py \
          tests/test_backcasting_enhancements.py tests/test_delphi.py tests/test_management_workflow.py \
          tests/test_responsibility_assignment.py tests/test_planning_budget.py tests/test_objective_performance.py \
          tests/test_program_portfolio.py tests/test_sandop.py tests/test_value_stream.py tests/test_flow_metrics.py \
          tests/test_swot.py tests/test_reference_class.py tests/test_business_plan.py tests/test_marketplace_integration.py \
          tests/test_process_mining.py tests/test_predictive_bpm.py tests/test_process_control.py tests/test_process_health.py \
          tests/test_process_escalation.py tests/test_bpm_state_models.py tests/test_process_model_sync.py -q
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
