version: 52
jobs:
- name: ci
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    cloneDepth: 1
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: command
    runInContainer: true
    image: ubuntu:24.04
    interpreter:
      type: PosixInterpreter
      shell: bash
      commands: |
        set -euo pipefail
        export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH
        # ── Compose namespace isolation (mandatory) ─────────────────────────
        # CI must never share a Compose project with any long-running stack.
        # The default project name derives from the workspace directory name,
        # which can collide with deployed stacks (historically: project "work").
        # Pin the namespace so every docker compose call below targets an
        # isolated, disposable project.
        export COMPOSE_PROJECT_NAME=ki-ci
        echo "=== [step] Pre-flight: compose namespace guard ==="
        if docker compose ls 2>/dev/null | grep -qE "^work[[:space:]]"; then
          if docker compose -p work ps --format '{{.Name}}' 2>/dev/null | grep -q .; then
            echo "GUARD: a 'work' Compose project exists on this host. CI is namespace-isolated"
            echo "under 'ki-ci' and will not touch it. Proceeding with isolated project."
          fi
        fi
        if [ "${COMPOSE_PROJECT_NAME}" != "ki-ci" ]; then
          echo "FATAL: COMPOSE_PROJECT_NAME must be 'ki-ci' in CI. Aborting to prevent" >&2
          echo "cross-project contamination with non-CI Compose stacks." >&2
          exit 1
        fi
        echo "Compose namespace: ${COMPOSE_PROJECT_NAME} (isolated from host stacks)"
        echo "=== [step] Installing Docker CLI ==="
        apt-get update -qq && apt-get install -y -qq curl ca-certificates git >/dev/null
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
        apt-get update -qq && apt-get install -y -qq docker-ce-cli docker-compose-plugin python3 python3-venv >/dev/null
        docker --version; docker compose version
        echo "=== [step] Writing CI .env ==="
        umask 077
        trap 'rm -f .env' EXIT
         cat > .env <<'EOF'
         KOKONUT_ENV=ci
         KOKONUT_ALLOW_PLAINTEXT_ENV=true
         POSTGRES_PASSWORD=ci-placeholder
        PG_HOST=database
        PG_DB=kokonut_intelligence
        PG_USER=kokonut
        PG_PASSWORD=ci-placeholder
         CLICKHOUSE_PASSWORD=ci-placeholder
         BACKUP_ENCRYPTION_KEY=ci-backup-key
        REDIS_PASSWORD=ci-placeholder
        DIRECTUS_SECRET=ci-secret
        ADMIN_EMAIL=ci@@kokonut.network
        ADMIN_PASSWORD=ci-password
        PUBLIC_URL=http://localhost:8055
        METABASE_EMBEDDING_SECRET_KEY=ci-embedding-secret
        EOF
        echo "=== [step] Supply-chain gates ==="
        ./scripts/check-tracked-secrets.sh
        ./scripts/check-image-digests.sh
        echo "=== [step] Start CI database (for bootstrap check) ==="
        # ci-check.sh runs verify-clean-bootstrap.sh, which needs a PostgreSQL
        # reachable via docker compose. With the isolated ki-ci namespace no
        # container exists yet, so start the database service now. The infra
        # step later runs 'down -v' + 'up' fresh, so this is disposable.
        docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d database
        for i in $(seq 1 30); do
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T database pg_isready -q && break
          sleep 1
        done
        docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T database pg_isready -q
        echo "CI database ready (project: ${COMPOSE_PROJECT_NAME})"
        echo "=== [step] Installing Python deps + security tools ==="
        apt-get update -qq && apt-get install -y -qq ca-certificates curl openssl libpq-dev gcc xz-utils >/dev/null
        curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
        apt-get install -y -qq nodejs >/dev/null
        python3 -m venv .venv
        . .venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install slither-analyzer==0.11.5 semgrep==1.170.0 ruff pip-audit
        npm install --global --no-audit --no-fund @@cyfrin/aderyn@@0.6.8
        curl --proto '=https' --tlsv1.2 -LsSf https://foundry.paradigm.xyz | bash
        /root/.foundry/bin/foundryup
        export PATH=/root/.foundry/bin:$PATH
        ./scripts/verify-ci-toolchain.sh
        echo "=== [step] Fast-fail: ruff security scan ==="
        . .venv/bin/activate
        ruff check --select S,BLE --ignore S101,S104,S105,S110,S112,S301,S310,S311,S320,S404,S603,S607,S608,RUF012,BLE001 services/
        echo "ruff: PASS"
        echo "=== [step] Fast-fail: pip-audit ==="
        pip-audit -r requirements.txt
        echo "pip-audit: PASS"
        echo "=== [step] Fast-fail: ci-check (imports + CLIs + TS build) ==="
        ./scripts/ci-check.sh
        echo "=== [step] Starting infrastructure ==="
        export KOKONUT_GIT_SHA="$(git rev-parse HEAD)"
        echo "Checked-out commit: $KOKONUT_GIT_SHA"
        docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v 2>/dev/null || true
        docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d database clickhouse cache
        docker compose -f docker-compose.yml -f docker-compose.ci.yml logs database | tail -50
        echo "=== [step] Waiting for PostgreSQL ==="
        for i in $(seq 1 30); do
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T database pg_isready -q && break
          sleep 1
        done
        docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T database pg_isready -q
        echo "=== [step] Applying init SQL (kokonut schema) ==="
        docker compose -f docker-compose.yml -f docker-compose.ci.yml \
          exec -T database psql -U kokonut -d kokonut_intelligence \
          -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\"" \
          -c "CREATE EXTENSION IF NOT EXISTS \"pgcrypto\"" \
          -c "CREATE EXTENSION IF NOT EXISTS pg_trgm" \
          -c "CREATE SCHEMA IF NOT EXISTS kokonut" \
          -c "GRANT USAGE ON SCHEMA kokonut TO kokonut" \
          -c "GRANT ALL ON SCHEMA public TO kokonut" \
          -c "ALTER DATABASE kokonut_intelligence SET search_path TO public, kokonut"
        echo "=== [step] Starting Directus ==="
        docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait directus
        echo "Directus is healthy according to its Compose healthcheck."
        echo "=== [step] Seeding database ==="
        export KOKONUT_ALLOW_PLAINTEXT_ENV=true
        rm -f .env.sops
        ./scripts/seed.sh
        ./scripts/seed-pilot.sh
        echo "=== [step] Starting application services ==="
        if ! docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait gateway grpc; then
          echo "=== [diagnostic] Application container status ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps || true
          echo "=== [diagnostic] Application container logs ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail=200 gateway grpc || true
          for service in gateway grpc; do
            container=$(docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -q "$service" || true)
            if [ -n "$container" ]; then
              echo "=== [diagnostic] $service health state ==="
              docker inspect --format '{{json .State.Health}}' "$container" || true
            fi
          done
          exit 1
        fi
        echo "=== [step] Verifying upgraded services ==="
        EXPECTED_VERSION="$(cat VERSION)"
        docker compose -f docker-compose.yml -f docker-compose.ci.yml \
          exec -T gateway python3 - "$EXPECTED_VERSION" "$KOKONUT_GIT_SHA" <<'PY'
        import sys
        import services
        expected_version, expected_sha = sys.argv[1:]
        if services.__version__ != expected_version:
            raise SystemExit(f"version mismatch: {services.__version__} != {expected_version}")
        if services.__git_sha__ != expected_sha:
            raise SystemExit(f"git SHA mismatch: {services.__git_sha__} != {expected_sha}")
        print(f"Upgrade verification passed: {expected_version} ({expected_sha})")
        PY
        echo "=== [step] Computing metrics ==="
        . .venv/bin/activate
        ./scripts/compute-metrics.sh
        export PATH=/root/.foundry/bin:$PATH
        echo "=== [step] Connecting CI runner to Compose databases ==="
        DB_CONTAINER=$(docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -q database)
        DB_NETWORK=$(docker inspect -f '{{range $network, $_ := .NetworkSettings.Networks}}{{println $network}}{{end}}' "$DB_CONTAINER")
        DB_NETWORK=${DB_NETWORK%%$'\n'*}
        CI_CONTAINER=$(cat /etc/hostname)
        if ! docker inspect "$CI_CONTAINER" >/dev/null 2>&1; then
          echo "Unable to identify the CI runner container ($CI_CONTAINER)."
          exit 1
        fi
        if ! docker network connect "$DB_NETWORK" "$CI_CONTAINER" 2>/dev/null; then
          if ! docker inspect -f '{{json .NetworkSettings.Networks}}' "$CI_CONTAINER" | grep -q "\"$DB_NETWORK\""; then
            echo "Unable to attach the CI runner to Compose network $DB_NETWORK."
            exit 1
          fi
        fi
        export PG_HOST=database
        export CH_HOST=clickhouse
        export CI_STRICT_DB=1
        echo "=== [step] Full test suite ==="
        ./scripts/verify-full-test-suite.sh
        echo "=== [step] Static analysis ==="
        ./scripts/static-analysis.sh
        echo "=== [step] Unified CLI smoke test ==="
        python3 -m services.cli --help >/dev/null
        python3 -m services.cli metrics --help >/dev/null
        echo "Unified CLI loads and exposes service groups."
        echo "=== [step] Solidity checks ==="
        (cd contracts && forge fmt --check && forge build --sizes && forge test)
        echo "=== [step] Directus hooks checks ==="
        (cd extensions/kokonut-hooks && npm ci --no-audit --no-fund && npm run build && npm test)
        echo "=== [step] Done ==="
        echo "All CI checks complete"
    runAs: 0:0
    useTTY: false
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone
  - type: PullRequestUpdateTrigger
    branches: main
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
