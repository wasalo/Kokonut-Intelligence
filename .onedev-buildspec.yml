version: 52
jobs:
- name: ci
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    cloneDepth: 1
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: command
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: bash
      commands: |
        set -e
        export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH
        # Install docker compose plugin if missing (persists on host after first build).
        if ! docker compose version >/dev/null 2>&1; then
          echo "Installing docker compose plugin..."
          mkdir -p /usr/libexec/docker/cli-plugins
          curl -sSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64" \
            -o /usr/libexec/docker/cli-plugins/docker-compose
          chmod +x /usr/libexec/docker/cli-plugins/docker-compose
        fi
        docker --version; docker compose version
        # Ephemeral .env from OneDev job secrets (read by compose and load_dotenv).
        printf 'POSTGRES_PASSWORD=%s\nCLICKHOUSE_PASSWORD=%s\nMETABASE_EMBEDDING_SECRET_KEY=%s\n' '@secrets:postgres-password@' '@secrets:clickhouse-password@' '@secrets:metabase-embedding-secret@' > .env
        # Start databases on the host (CI override publishes to 127.0.0.1).
        docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d database clickhouse
        # Wait for PostgreSQL to accept connections.
        for i in $(seq 1 30); do
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T database pg_isready -q && break
          sleep 1
        done
        docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T database pg_isready -q
        rm -f .env.sops
        ./scripts/seed.sh
        # Isolate Python deps (host Python 3.11).
        python3 -m venv .venv
        . .venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        export PG_HOST=localhost PG_PORT=5432 CH_HOST=localhost CH_PORT=8123
        python3 -m tests.test_metrics
        python3 -m pytest tests/test_migration.py tests/test_gateway_auth.py tests/test_scheduler_durability.py tests/test_event_bus_durability.py tests/test_carbon_credits.py tests/test_threatcasting.py tests/test_backcasting_enhancements.py tests/test_delphi.py tests/test_management_workflow.py tests/test_responsibility_assignment.py tests/test_planning_budget.py tests/test_objective_performance.py tests/test_program_portfolio.py tests/test_sandop.py tests/test_value_stream.py tests/test_flow_metrics.py tests/test_swot.py tests/test_reference_class.py tests/test_business_plan.py tests/test_marketplace_integration.py tests/test_process_mining.py tests/test_predictive_bpm.py tests/test_process_control.py tests/test_process_health.py tests/test_process_escalation.py tests/test_bpm_state_models.py tests/test_process_model_sync.py -q
    useTTY: false
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone
  - type: PullRequestUpdateTrigger
    branches: main
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
