name: Publish Kernel images

run-name: Publish Kernel images from ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish to authorize a release image build from main
        type: choice
        options: [no, publish]
        default: no
        required: true

permissions:
  contents: read

concurrency:
  group: kernel-image-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      app_image: ${{ steps.publish_images.outputs.app_image }}
      oidc_image: ${{ steps.publish_images.outputs.oidc_image }}
    # Configure this GitHub Environment with required reviewers, prevent
    # self-review, and restrict deployment branches to main before first use.
    environment:
      name: kernel-release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out reviewed main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the explicit main release trigger
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Kernel image publication is allowed only from main." >&2
            exit 1
          fi
          if [[ "$RELEASE_CONFIRMATION" != publish ]]; then
            echo "Kernel image publication requires the explicit publish confirmation." >&2
            exit 1
          fi

      - name: Verify locked release inputs
        run: python3 scripts/check-kernel-release-inputs.py

      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Build, publish, and record digest-pinned Standard images
        id: publish_images
        shell: bash
        run: |
          set -euo pipefail

          image_suffix="${GITHUB_REPOSITORY,,}"
          app_repository="ghcr.io/${image_suffix}-kernel"
          oidc_repository="ghcr.io/${image_suffix}-kernel-oidc"
          release_tag="release-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          work_dir="$(mktemp -d "$RUNNER_TEMP/kernel-release.XXXXXX")"
          trap 'rm -rf "$work_dir"' EXIT

          build_and_publish() {
            local target="$1"
            local repository="$2"
            local metadata_file="$work_dir/${target}-metadata.json"
            local manifest_file="$work_dir/${target}-manifest.json"
            local digest image_ref

            docker buildx build \
              --pull \
              --platform linux/amd64,linux/arm64 \
              --target "$target" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --tag "${repository}:${release_tag}" \
              --metadata-file "$metadata_file" \
              --provenance=mode=max \
              --sbom=true \
              --push \
              --file Dockerfile.kernel \
              .

            digest="$(python3 - "$metadata_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as metadata_file:
              metadata = json.load(metadata_file)
          print(metadata.get("containerimage.digest", ""))
          PY
          )"
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Buildx did not return a valid pushed image digest for ${target}." >&2
              return 1
            fi

            image_ref="${repository}@${digest}"
            docker buildx imagetools inspect --raw "$image_ref" > "$manifest_file"
            python3 - "$manifest_file" "$target" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as manifest_file:
              manifest = json.load(manifest_file)
          if not isinstance(manifest, dict) or not isinstance(manifest.get("manifests"), list):
              raise SystemExit(f"{sys.argv[2]} did not publish a multi-platform image index")
          platforms = {
              f"{entry.get('platform', {}).get('os')}/{entry.get('platform', {}).get('architecture')}"
              for entry in manifest["manifests"]
              if isinstance(entry, dict) and isinstance(entry.get("platform"), dict)
          }
          missing = {"linux/amd64", "linux/arm64"} - platforms
          if missing:
              raise SystemExit(f"{sys.argv[2]} image index is missing platforms: {sorted(missing)}")
          PY

            if [[ "$target" == kernel ]]; then
              echo "export KOKONUT_KERNEL_APP_IMAGE='${image_ref}'" >> "$GITHUB_STEP_SUMMARY"
              echo "app_image=${image_ref}" >> "$GITHUB_OUTPUT"
            else
              echo "export KOKONUT_KERNEL_OIDC_IMAGE='${image_ref}'" >> "$GITHUB_STEP_SUMMARY"
              echo "oidc_image=${image_ref}" >> "$GITHUB_OUTPUT"
            fi
          }

          {
            echo "## Digest-pinned Standard images"
            echo
            echo "Source commit: \`${GITHUB_SHA}\`"
            echo "Release build tag: \`${release_tag}\`"
            echo
            echo 'Copy the following references into the release environment and pass them to'
            echo '`scripts/kernel-profile.py standard --action release-up`.'
            echo
            echo '```sh'
          } >> "$GITHUB_STEP_SUMMARY"

          build_and_publish kernel "$app_repository"
          build_and_publish oidc "$oidc_repository"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
