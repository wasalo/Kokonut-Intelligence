name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-ci:
    name: full-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COMPOSE_PROJECT_NAME: ki-ci
      CI_PG_HOST_PORT: 127.0.0.1:15432
      CI_CH_HOST_PORT: 127.0.0.1:18123
      DIRECTUS_HOST_PORT: 127.0.0.1:18055
      GATEWAY_HOST_PORT: 127.0.0.1:18099
      GRPC_HOST_PORT: 127.0.0.1:50052
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: .node-version

      - name: Install pinned Foundry toolchain
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5
          cache: false

      - name: Run the complete CI gate
        run: bash scripts/run-github-ci.sh

  kernel-image:
    name: kernel-image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and verify Kernel images
        run: bash scripts/build-kernel-multiarch.sh

  ci:
    name: ci
    if: always()
    needs: [full-ci, kernel-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Enforce all required CI gates
        env:
          FULL_CI_RESULT: ${{ needs.full-ci.result }}
          KERNEL_IMAGE_RESULT: ${{ needs.kernel-image.result }}
        run: |
          if [[ "$FULL_CI_RESULT" != "success" || "$KERNEL_IMAGE_RESULT" != "success" ]]; then
            printf 'Full CI result: %s\nKernel image result: %s\n' \
              "$FULL_CI_RESULT" "$KERNEL_IMAGE_RESULT" >&2
            exit 1
          fi
          echo 'Full CI and multi-architecture Kernel image gates passed.'
