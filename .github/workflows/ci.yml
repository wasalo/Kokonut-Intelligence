name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      POSTGRES_PASSWORD: ci-placeholder
      CLICKHOUSE_PASSWORD: ci-placeholder
      PG_HOST: localhost
      PG_PORT: "5432"
      CH_HOST: localhost
      CH_PORT: "8123"
      KOKONUT_METRICS_EXECUTION: host
      KOKONUT_ENV: development
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt && pip install ruff mypy

      - name: Write CI environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-placeholder
          CLICKHOUSE_PASSWORD=ci-placeholder
          REDIS_PASSWORD=ci-placeholder
          DIRECTUS_SECRET=ci-secret
          ADMIN_EMAIL=ci@kokonut.network
          ADMIN_PASSWORD=ci-password
          PUBLIC_URL=http://localhost:8055
          METABASE_EMBEDDING_SECRET_KEY=ci-embedding-secret
          EOF

      - name: Start PostgreSQL and ClickHouse
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d database clickhouse
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T database pg_isready -U kokonut -d kokonut_intelligence >/dev/null 2>&1 && \
               docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T clickhouse clickhouse-client --user kokonut --password "$CLICKHOUSE_PASSWORD" --query "SELECT 1" >/dev/null 2>&1; then
              echo "Databases ready."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Databases did not become ready"
              docker compose -f docker-compose.yml -f docker-compose.ci.yml logs database clickhouse
              exit 1
            fi
            sleep 5
          done

      - name: Run ruff linter
        run: ruff check services/ tests/

      - name: Run mypy type checks
        run: mypy services/ --ignore-missing-imports --no-error-summary

      - name: Run CI check script
        run: ./scripts/ci-check.sh

      - name: Run CLI smoke tests
        run: python3 -m tests.test_cli

      - name: Run attestation tests
        run: python3 -m tests.test_attestation

      - name: Run integration tests
        run: |
          python3 -m tests.test_forecast && \
          python3 -m tests.test_fortune500 && \
          python3 -m tests.test_ingestion_retry && \
          python3 -m tests.test_gis_import && \
          python3 -m tests.test_market_data && \
          python3 -m tests.test_sdk

  hooks:
    name: Directus hooks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: extensions/kokonut-hooks
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extensions/kokonut-hooks/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Run workflow unit tests
        run: npm test

  contracts:
    name: Foundry contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv
