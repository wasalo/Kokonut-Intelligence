name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      POSTGRES_PASSWORD: ci-placeholder
      CLICKHOUSE_PASSWORD: ci-placeholder
      PG_HOST: localhost
      PG_PORT: "5432"
      CH_HOST: localhost
      CH_PORT: "8123"
      CI_STRICT_DB: "1"
      KOKONUT_METRICS_EXECUTION: host
      KOKONUT_ENV: development
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt && python -m pip install ruff mypy

      - name: Validate Python runtime and FastAPI
        run: |
          python scripts/check-python-runtime.py
          python -c 'import fastapi; from fastapi.testclient import TestClient; print(f"FastAPI {fastapi.__version__}")'

      - name: Write CI environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-placeholder
          CLICKHOUSE_PASSWORD=ci-placeholder
          REDIS_PASSWORD=ci-placeholder
          DIRECTUS_SECRET=ci-secret
          ADMIN_EMAIL=ci@kokonut.network
          ADMIN_PASSWORD=ci-password
          PUBLIC_URL=http://localhost:8055
          METABASE_EMBEDDING_SECRET_KEY=ci-embedding-secret
          EOF

      - name: Start databases and Directus
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d database clickhouse cache directus
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T database pg_isready -U kokonut -d kokonut_intelligence >/dev/null 2>&1 && \
               docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T clickhouse clickhouse-client --user kokonut --password "$CLICKHOUSE_PASSWORD" --query "SELECT 1" >/dev/null 2>&1; then
              echo "Databases ready."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Databases did not become ready"
              docker compose -f docker-compose.yml -f docker-compose.ci.yml logs database clickhouse
              exit 1
            fi
            sleep 5
          done
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8055/server/ping >/dev/null; then
              echo "Directus ready."
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker compose -f docker-compose.yml -f docker-compose.ci.yml logs directus
              exit 1
            fi
            sleep 2
          done

      - name: Seed database and pilot fixtures
        run: |
          ./scripts/seed.sh
          ./scripts/seed-pilot.sh

      - name: Generate TypeScript SDK
        run: |
          cd sdk/typescript
          npm install --no-audit --no-fund
          npm run generate
          npm run build

      - name: Run ruff linter
        run: ruff check services/ tests/

      - name: Run mypy type checks
        run: mypy services/ --ignore-missing-imports --no-error-summary

      - name: Run CI check script
        run: ./scripts/ci-check.sh

      - name: Run full test suite without skips
        run: ./scripts/verify-full-test-suite.sh

      - name: Run CLI smoke tests
        run: python3 -m tests.test_cli

      - name: Run attestation tests
        run: python3 -m tests.test_attestation

      - name: Run integration tests
        run: |
          python3 -m tests.test_forecast && \
          python3 -m tests.test_fortune500 && \
          python3 -m tests.test_ingestion_retry && \
          python3 -m tests.test_gis_import && \
          python3 -m tests.test_market_data && \
          python3 -m tests.test_sdk

  hooks:
    name: Directus hooks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: extensions/kokonut-hooks
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extensions/kokonut-hooks/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Run workflow unit tests
        run: npm test

  contracts:
    name: Foundry contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      - name: Install static analysis tools
        run: |
          cd ..
          python3 -m pip install --user slither-analyzer==0.11.5 semgrep==1.170.0
          npm install --global --no-audit --no-fund @cyfrin/aderyn@0.6.8

      - name: Run static analysis gate
        run: |
          cd ..
          ./scripts/verify-ci-toolchain.sh
          ./scripts/static-analysis.sh
