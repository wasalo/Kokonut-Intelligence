# Worker overlay — legacy ingestion, event dispatch, and notification delivery
# Usage: docker compose -f docker-compose.yml -f docker-compose.worker.yml up -d kokonut-worker
# To run only event dispatch or notification delivery, target `event-worker` or
# `notification-worker` explicitly with `--profile worker`.
#
# The worker container connects to the databases network to reach PostgreSQL and ClickHouse.
# It does not expose any ports — all communication is internal.
#
# To run ad-hoc commands:
#   docker compose exec kokonut-worker python3 -m services.metrics --list
#   docker compose exec kokonut-worker python3 -m services.analytics --portfolio-summary
#   docker compose exec kokonut-worker bash scripts/health-check.sh

services:
  kokonut-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - databases
    volumes:
      - ${KOKONUT_SENSOR_CSV_HOST_DIR:-./data/sensor-inputs}:/var/lib/kokonut/sensor-inputs:ro
    environment:
      KOKONUT_ENV: ${KOKONUT_ENV:-production}
      KOKONUT_GIT_SHA: ${KOKONUT_GIT_SHA:-unknown}
      PG_HOST: database
      PG_PORT: "5432"
      PG_DB: ${PG_DB:-kokonut_intelligence}
      PG_USER: ${KOKONUT_RUNTIME_USER:-kokonut_runtime}
      PG_PASSWORD: ${KOKONUT_RUNTIME_PASSWORD:?KOKONUT_RUNTIME_PASSWORD must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      CH_HOST: clickhouse
      CH_PORT: "8123"
      CH_USER: ${CH_USER:-kokonut}
      CH_DB: ${CH_DB:-kokonut_analytics}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      DIRECTUS_URL: http://directus:8055
      CLICKHOUSE_URL: http://clickhouse:8123
      DISK_THRESHOLD: ${DISK_THRESHOLD:-90}
      MEM_THRESHOLD: ${MEM_THRESHOLD:-90}
      HEALTH_CHECK_DOCKER: "false"
      KOKONUT_LOG_LEVEL: ${KOKONUT_LOG_LEVEL:-INFO}
      KOKONUT_SENSOR_CSV_ROOT: /var/lib/kokonut/sensor-inputs
      KOKONUT_SENSOR_INGESTION_DATABASE_URL: ${KOKONUT_SENSOR_INGESTION_DATABASE_URL:-}
      KOKONUT_SENSOR_INGESTION_WORKER_CREDENTIAL: ${KOKONUT_SENSOR_INGESTION_WORKER_CREDENTIAL:-}
      KOKONUT_FEATURE_SIGNED_SENSOR_INGESTION_WORKER: ${KOKONUT_FEATURE_SIGNED_SENSOR_INGESTION_WORKER:-false}
      KOKONUT_REMOTE_SENSING_DATABASE_URL: ${KOKONUT_REMOTE_SENSING_DATABASE_URL:-}
      KOKONUT_REMOTE_SENSING_WORKER_CREDENTIAL: ${KOKONUT_REMOTE_SENSING_WORKER_CREDENTIAL:-}
      KOKONUT_REMOTE_SENSING_GEE_SERVICE_ACCOUNT_KEY: ${KOKONUT_REMOTE_SENSING_GEE_SERVICE_ACCOUNT_KEY:-}
      KOKONUT_REMOTE_SENSING_COPERNICUS_EMAIL: ${KOKONUT_REMOTE_SENSING_COPERNICUS_EMAIL:-}
      KOKONUT_REMOTE_SENSING_COPERNICUS_PASSWORD: ${KOKONUT_REMOTE_SENSING_COPERNICUS_PASSWORD:-}
      KOKONUT_REMOTE_SENSING_COPERNICUS_CLIENT_ID: ${KOKONUT_REMOTE_SENSING_COPERNICUS_CLIENT_ID:-}
      KOKONUT_REMOTE_SENSING_COPERNICUS_CLIENT_SECRET: ${KOKONUT_REMOTE_SENSING_COPERNICUS_CLIENT_SECRET:-}
      KOKONUT_FEATURE_SIGNED_REMOTE_SENSING_WORKER: ${KOKONUT_FEATURE_SIGNED_REMOTE_SENSING_WORKER:-false}
      # Ingestion
      INGESTION_MAX_RETRIES: ${INGESTION_MAX_RETRIES:-3}
      INGESTION_BACKOFF: ${INGESTION_BACKOFF:-2}
      INGESTION_JITTER: ${INGESTION_JITTER:-0.5}
      OpenWeatherMap_API_KEY: ${OpenWeatherMap_API_KEY:-}
      # Web3 RPC
      ETH_RPC_URL: ${ETH_RPC_URL:-}
      OPTIMISM_RPC_URL: ${OPTIMISM_RPC_URL:-}
      BASE_RPC_URL: ${BASE_RPC_URL:-}
      ARBITRUM_RPC_URL: ${ARBITRUM_RPC_URL:-}
      GNOSIS_RPC_URL: ${GNOSIS_RPC_URL:-https://rpc.gnosischain.com}
      CELO_RPC_URL: ${CELO_RPC_URL:-https://forno.celo.org}
      EAS_GRAPHQL_URL: ${EAS_GRAPHQL_URL:-https://attest.sh}
      # Attestation
      ATTESTER_PRIVATE_KEY: ${ATTESTER_PRIVATE_KEY:-}
      EAS_RESOLVER_ADDRESS: ${EAS_RESOLVER_ADDRESS:-}
      # Alerts
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-587}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-alerts@kokonut.network}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # CIDS
      KOKONUT_CIDS_BASE_URL: ${KOKONUT_CIDS_BASE_URL:-}
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - worker

  # Deterministic AI-summary reads use a signed, 13-view location-scoped login.
  # Shared synthesis reads use a separate public-view-only database login below.
  # After sourcing secrets: docker compose -f docker-compose.yml -f docker-compose.worker.yml
  #   --profile agent-summary-worker run --rm agent-summary-worker --location-id UUID \
  #     --summary-type combined --request-id UUID
  agent-summary-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    entrypoint:
      ["python3", "-m", "services.agents.worker_cli", "--deterministic-only"]
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - databases
    environment:
      KOKONUT_ENV: ${KOKONUT_ENV:-production}
      KOKONUT_AGENT_SUMMARY_DETERMINISTIC_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_SUMMARY_DETERMINISTIC_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_SUMMARY_DETERMINISTIC_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_SUMMARY_DETERMINISTIC_SOURCE_WORKER_CREDENTIAL:-}
      KOKONUT_AGENT_SUMMARY_DRAFT_DATABASE_URL: ${KOKONUT_AGENT_SUMMARY_DRAFT_DATABASE_URL:-}
      KOKONUT_AGENT_SUMMARY_DRAFT_WORKER_CREDENTIAL: ${KOKONUT_AGENT_SUMMARY_DRAFT_WORKER_CREDENTIAL:-}
      PYTHONDONTWRITEBYTECODE: "1"
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - agent-summary-worker

  # Organic readiness runs only its 15 location-scoped source projections.
  # It cannot use the broader shared synthesis source identity.
  # After sourcing secrets:
  #   docker compose -f docker-compose.yml -f docker-compose.worker.yml \
  #     --profile organic-readiness-worker run --rm agent-organic-readiness-worker \
  #     --location-id UUID --request-id UUID
  agent-organic-readiness-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    entrypoint:
      [
        "python3", "-m", "services.agents.worker_cli",
        "--source-only", "--task-key", "organic_readiness_synthesis"
      ]
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - databases
    environment:
      KOKONUT_ENV: ${KOKONUT_ENV:-production}
      KOKONUT_AGENT_ORGANIC_READINESS_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_ORGANIC_READINESS_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_ORGANIC_READINESS_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_ORGANIC_READINESS_SOURCE_WORKER_CREDENTIAL:-}
      KOKONUT_AGENT_SUMMARY_DRAFT_DATABASE_URL: ${KOKONUT_AGENT_SUMMARY_DRAFT_DATABASE_URL:-}
      KOKONUT_AGENT_SUMMARY_DRAFT_WORKER_CREDENTIAL: ${KOKONUT_AGENT_SUMMARY_DRAFT_WORKER_CREDENTIAL:-}
      PYTHONDONTWRITEBYTECODE: "1"
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - organic-readiness-worker

  # Ecological modeling uses fourteen scoped calculation projections and
  # thirteen location-qualified provenance views under its own reader.
  # After sourcing secrets:
  #   docker compose -f docker-compose.yml -f docker-compose.worker.yml \
  #     --profile ecological-modeling-worker run --rm agent-ecological-modeling-worker \
  #     --location-id UUID --request-id UUID
  agent-ecological-modeling-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    entrypoint:
      [
        "python3", "-m", "services.agents.worker_cli",
        "--source-only", "--task-key", "ecological_modeling_synthesis"
      ]
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - databases
    environment:
      KOKONUT_ENV: ${KOKONUT_ENV:-production}
      KOKONUT_AGENT_ECOLOGICAL_MODELING_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_ECOLOGICAL_MODELING_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_ECOLOGICAL_MODELING_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_ECOLOGICAL_MODELING_SOURCE_WORKER_CREDENTIAL:-}
      KOKONUT_AGENT_SUMMARY_DRAFT_DATABASE_URL: ${KOKONUT_AGENT_SUMMARY_DRAFT_DATABASE_URL:-}
      KOKONUT_AGENT_SUMMARY_DRAFT_WORKER_CREDENTIAL: ${KOKONUT_AGENT_SUMMARY_DRAFT_WORKER_CREDENTIAL:-}
      PYTHONDONTWRITEBYTECODE: "1"
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - ecological-modeling-worker

  # Exact-location AI-summary list and digest inspection; no draft identity.
  # Example:
  #   docker compose -f docker-compose.yml -f docker-compose.worker.yml \
  #     --profile ai-summary-inspection-worker run --rm ai-summary-inspection-worker \
  #     --list --location-id UUID
  ai-summary-inspection-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    entrypoint:
      ["python3", "-m", "services.agents.ai_summary"]
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - databases
    environment:
      KOKONUT_ENV: ${KOKONUT_ENV:-production}
      KOKONUT_AGENT_SUMMARY_INSPECTION_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_SUMMARY_INSPECTION_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_SUMMARY_INSPECTION_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_SUMMARY_INSPECTION_SOURCE_WORKER_CREDENTIAL:-}
      PYTHONDONTWRITEBYTECODE: "1"
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - ai-summary-inspection-worker

  # Shared synthesis has no PG_* or shared DATABASE_URL credentials. Its
  # source login can read only signed, location-filtered wrapper views;
  # signed draft persistence uses the separate agent_summary_draft identity.
  # Example:
  #   docker compose -f docker-compose.yml -f docker-compose.worker.yml \
  #     --profile agent-synthesis-worker run --rm agent-synthesis-worker \
  #     --task-key feedback_synthesis --location-id UUID --request-id UUID
  agent-synthesis-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    entrypoint:
      ["python3", "-m", "services.agents.worker_cli", "--source-only"]
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - databases
    environment:
      KOKONUT_ENV: ${KOKONUT_ENV:-production}
      KOKONUT_AGENT_SUMMARY_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_SUMMARY_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_SUMMARY_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_SUMMARY_SOURCE_WORKER_CREDENTIAL:-}
      KOKONUT_AGENT_SUMMARY_DRAFT_DATABASE_URL: ${KOKONUT_AGENT_SUMMARY_DRAFT_DATABASE_URL:-}
      KOKONUT_AGENT_SUMMARY_DRAFT_WORKER_CREDENTIAL: ${KOKONUT_AGENT_SUMMARY_DRAFT_WORKER_CREDENTIAL:-}
      PYTHONDONTWRITEBYTECODE: "1"
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - agent-synthesis-worker

  # EBF evidence-gap reads use a task-specific login and one narrow projection.
  # Example:
  #   docker compose -f docker-compose.yml -f docker-compose.worker.yml \
  #     --profile ebf-evidence-gap-worker run --rm ebf-evidence-gap-worker \
  #     --scorecard-id UUID --location-id UUID
  ebf-evidence-gap-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    entrypoint:
      ["python3", "-m", "services.agents.ebf_evidence_gap_agent"]
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - databases
    environment:
      KOKONUT_ENV: ${KOKONUT_ENV:-production}
      KOKONUT_AGENT_EBF_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_EBF_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_EBF_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_EBF_SOURCE_WORKER_CREDENTIAL:-}
      PYTHONDONTWRITEBYTECODE: "1"
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - ebf-evidence-gap-worker

  # CIDS export uses a task-specific login and the six minimal projection views.
  # Example:
  #   docker compose -f docker-compose.yml -f docker-compose.worker.yml \
  #     --profile cids-export-worker run --rm cids-export-worker --location-id UUID
  cids-export-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    entrypoint:
      ["python3", "-m", "services.agents.cids_agent"]
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - databases
    environment:
      KOKONUT_ENV: ${KOKONUT_ENV:-production}
      KOKONUT_AGENT_CIDS_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_CIDS_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_CIDS_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_CIDS_SOURCE_WORKER_CREDENTIAL:-}
      PYTHONDONTWRITEBYTECODE: "1"
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - cids-export-worker

  # Delphi agent reads use a task-specific login and consent-aware projection.
  # Example:
  #   docker compose -f docker-compose.yml -f docker-compose.worker.yml \
  #     --profile delphi-agent-worker run --rm delphi-agent-worker \
  #     --study-id UUID --location-id UUID
  delphi-agent-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    entrypoint: ["python3", "-m", "services.agents.delphi_facilitator_agent"]
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - databases
    environment:
      KOKONUT_ENV: ${KOKONUT_ENV:-production}
      KOKONUT_AGENT_DELPHI_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_DELPHI_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_DELPHI_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_DELPHI_SOURCE_WORKER_CREDENTIAL:-}
      PYTHONDONTWRITEBYTECODE: "1"
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - delphi-agent-worker

  event-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["python3", "-m", "services.events", "--event-worker", "--worker-id", "event-worker"]
    user: appuser
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    networks:
      - databases
    environment:
      PG_HOST: database
      PG_PORT: "5432"
      PG_DB: ${PG_DB:-kokonut_intelligence}
      PG_USER: ${PG_USER:-kokonut}
      PG_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      KOKONUT_LOG_LEVEL: ${KOKONUT_LOG_LEVEL:-INFO}
      KOKONUT_GIT_SHA: ${KOKONUT_GIT_SHA:-unknown}
      KOKONUT_FEATURE_EVENT_BUS: ${KOKONUT_FEATURE_EVENT_BUS:-true}
      # Event handlers use configured destinations to decide which durable
      # notification intents to enqueue; only notification-worker sends them.
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_ADMIN_TOKEN: ${DIRECTUS_ADMIN_TOKEN:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-587}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-alerts@kokonut.network}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - worker

  notification-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["python3", "-m", "services.events", "--notification-worker", "--worker-id", "notification-worker"]
    user: appuser
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    networks:
      - databases
    environment:
      PG_HOST: database
      PG_PORT: "5432"
      PG_DB: ${PG_DB:-kokonut_intelligence}
      PG_USER: ${PG_USER:-kokonut}
      PG_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      KOKONUT_LOG_LEVEL: ${KOKONUT_LOG_LEVEL:-INFO}
      KOKONUT_FEATURE_NOTIFICATION_DELIVERY: ${KOKONUT_FEATURE_NOTIFICATION_DELIVERY:-${KOKONUT_FEATURE_EVENT_BUS:-true}}
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_ADMIN_TOKEN: ${DIRECTUS_ADMIN_TOKEN:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-587}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-alerts@kokonut.network}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    deploy:
      resources:
        limits:
          memory: 256M
    profiles:
      - worker

  # Opt-in database scheduler. The cron worker remains unchanged to avoid
  # silently running both dispatch mechanisms during migration.
  kokonut-scheduler:
    extends: kokonut-worker
    command: ["python3", "-m", "services.scheduler.worker", "--tick-interval", "30"]
    profiles:
      - scheduler
