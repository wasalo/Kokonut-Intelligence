# Worker overlay — legacy ingestion, event dispatch, and notification delivery
# Usage: docker compose -f docker-compose.yml -f docker-compose.worker.yml up -d kokonut-worker
# To run only event dispatch or notification delivery, target `event-worker` or
# `notification-worker` explicitly with `--profile worker`.
#
# The worker container connects to the databases network to reach PostgreSQL and ClickHouse.
# It does not expose any ports — all communication is internal.
#
# To run ad-hoc commands:
#   docker compose exec kokonut-worker python3 -m services.metrics --list
#   docker compose exec kokonut-worker python3 -m services.analytics --portfolio-summary
#   docker compose exec kokonut-worker bash scripts/health-check.sh

services:
  kokonut-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - databases
    volumes:
      - ${KOKONUT_SENSOR_CSV_HOST_DIR:-./data/sensor-inputs}:/var/lib/kokonut/sensor-inputs:ro
    environment:
      KOKONUT_ENV: ${KOKONUT_ENV:-production}
      KOKONUT_GIT_SHA: ${KOKONUT_GIT_SHA:-unknown}
      PG_HOST: database
      PG_PORT: "5432"
      PG_DB: ${PG_DB:-kokonut_intelligence}
      PG_USER: ${KOKONUT_RUNTIME_USER:-kokonut_runtime}
      PG_PASSWORD: ${KOKONUT_RUNTIME_PASSWORD:?KOKONUT_RUNTIME_PASSWORD must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      CH_HOST: clickhouse
      CH_PORT: "8123"
      CH_USER: ${CH_USER:-kokonut}
      CH_DB: ${CH_DB:-kokonut_analytics}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      DIRECTUS_URL: http://directus:8055
      CLICKHOUSE_URL: http://clickhouse:8123
      DISK_THRESHOLD: ${DISK_THRESHOLD:-90}
      MEM_THRESHOLD: ${MEM_THRESHOLD:-90}
      HEALTH_CHECK_DOCKER: "false"
      KOKONUT_LOG_LEVEL: ${KOKONUT_LOG_LEVEL:-INFO}
      KOKONUT_SENSOR_CSV_ROOT: /var/lib/kokonut/sensor-inputs
      KOKONUT_SENSOR_INGESTION_DATABASE_URL: ${KOKONUT_SENSOR_INGESTION_DATABASE_URL:-}
      KOKONUT_SENSOR_INGESTION_WORKER_CREDENTIAL: ${KOKONUT_SENSOR_INGESTION_WORKER_CREDENTIAL:-}
      KOKONUT_FEATURE_SIGNED_SENSOR_INGESTION_WORKER: ${KOKONUT_FEATURE_SIGNED_SENSOR_INGESTION_WORKER:-false}
      KOKONUT_REMOTE_SENSING_DATABASE_URL: ${KOKONUT_REMOTE_SENSING_DATABASE_URL:-}
      KOKONUT_GNOSIS_INDEXER_DATABASE_URL: ${KOKONUT_GNOSIS_INDEXER_DATABASE_URL:-}
      KOKONUT_GNOSIS_INDEXER_RPC_ENDPOINTS: ${KOKONUT_GNOSIS_INDEXER_RPC_ENDPOINTS:-}
      KOKONUT_FEATURE_ISOLATED_GNOSIS_INDEXER_WORKER: ${KOKONUT_FEATURE_ISOLATED_GNOSIS_INDEXER_WORKER:-false}
      KOKONUT_BAAL_INDEXER_DATABASE_URL: ${KOKONUT_BAAL_INDEXER_DATABASE_URL:-}
      KOKONUT_BAAL_INDEXER_RPC_ENDPOINT: ${KOKONUT_BAAL_INDEXER_RPC_ENDPOINT:-}
      KOKONUT_FEATURE_ISOLATED_BAAL_INDEXER_WORKER: ${KOKONUT_FEATURE_ISOLATED_BAAL_INDEXER_WORKER:-false}
      KOKONUT_REMOTE_SENSING_WORKER_CREDENTIAL: ${KOKONUT_REMOTE_SENSING_WORKER_CREDENTIAL:-}
      KOKONUT_REMOTE_SENSING_GEE_SERVICE_ACCOUNT_KEY: ${KOKONUT_REMOTE_SENSING_GEE_SERVICE_ACCOUNT_KEY:-}
      KOKONUT_REMOTE_SENSING_COPERNICUS_EMAIL: ${KOKONUT_REMOTE_SENSING_COPERNICUS_EMAIL:-}
      KOKONUT_REMOTE_SENSING_COPERNICUS_PASSWORD: ${KOKONUT_REMOTE_SENSING_COPERNICUS_PASSWORD:-}
      KOKONUT_REMOTE_SENSING_COPERNICUS_CLIENT_ID: ${KOKONUT_REMOTE_SENSING_COPERNICUS_CLIENT_ID:-}
      KOKONUT_REMOTE_SENSING_COPERNICUS_CLIENT_SECRET: ${KOKONUT_REMOTE_SENSING_COPERNICUS_CLIENT_SECRET:-}
      KOKONUT_FEATURE_SIGNED_REMOTE_SENSING_WORKER: ${KOKONUT_FEATURE_SIGNED_REMOTE_SENSING_WORKER:-false}
      # Ingestion
      INGESTION_MAX_RETRIES: ${INGESTION_MAX_RETRIES:-3}
      INGESTION_BACKOFF: ${INGESTION_BACKOFF:-2}
      INGESTION_JITTER: ${INGESTION_JITTER:-0.5}
      OpenWeatherMap_API_KEY: ${OpenWeatherMap_API_KEY:-}
      # Web3 RPC
      ETH_RPC_URL: ${ETH_RPC_URL:-}
      OPTIMISM_RPC_URL: ${OPTIMISM_RPC_URL:-}
      BASE_RPC_URL: ${BASE_RPC_URL:-}
      ARBITRUM_RPC_URL: ${ARBITRUM_RPC_URL:-}
      GNOSIS_RPC_URL: ${GNOSIS_RPC_URL:-https://rpc.gnosischain.com}
      CELO_RPC_URL: ${CELO_RPC_URL:-https://forno.celo.org}
      EAS_GRAPHQL_URL: ${EAS_GRAPHQL_URL:-https://attest.sh}
      # Attestation
      ATTESTER_PRIVATE_KEY: ${ATTESTER_PRIVATE_KEY:-}
      EAS_RESOLVER_ADDRESS: ${EAS_RESOLVER_ADDRESS:-}
      # Alerts
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-587}
      ALERT_SMTP_TLS_MODE: ${ALERT_SMTP_TLS_MODE:-starttls}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-alerts@kokonut.network}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # CIDS
      KOKONUT_CIDS_BASE_URL: ${KOKONUT_CIDS_BASE_URL:-}
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - worker

  # Deterministic AI-summary reads use a signed, 13-view location-scoped login.
  # Shared synthesis reads use a separate public-view-only database login below.
  # After sourcing secrets: docker compose -f docker-compose.yml -f docker-compose.worker.yml
  #   --profile agent-summary-worker run --rm agent-summary-worker --location-id UUID \
  #     --summary-type combined --read-only
  agent-summary-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    entrypoint:
      ["python3", "-m", "services.agents.worker_cli", "--read-only", "--deterministic-only"]
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - databases
    environment:
      KOKONUT_ENV: ${KOKONUT_ENV:-production}
      KOKONUT_AGENT_SUMMARY_DETERMINISTIC_SOURCE_DATABASE_URL: ${KOKONUT_AGENT_SUMMARY_DETERMINISTIC_SOURCE_DATABASE_URL:-}
      KOKONUT_AGENT_SUMMARY_DETERMINISTIC_SOURCE_WORKER_CREDENTIAL: ${KOKONUT_AGENT_SUMMARY_DETERMINISTIC_SOURCE_WORKER_CREDENTIAL:-}
      PYTHONDONTWRITEBYTECODE: "1"
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - agent-summary-worker

  # Organic readiness runs only its 15 location-scoped source projections.
  # It cannot use the broader shared synthesis source identity.
  # After sourcing secrets:
  #   docker compose -f docker-compose.yml -f docker-compose.worker.yml \
