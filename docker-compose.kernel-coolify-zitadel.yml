# Keep Caddy private and HTTP-only behind Coolify Traefik. The identity-edge
# profile routes ZITADEL's Login V2 and API while the Kernel runtime is off;
# public TLS terminates at Traefik.
services:
  proxy:
    profiles: [identity-edge]
    ports: !reset []
    expose:
      - "80"
    volumes:
      - ./config/caddy/Caddyfile.kernel.coolify:/etc/caddy/Caddyfile:ro
