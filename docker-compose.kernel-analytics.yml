# Opt-in overlay; combine only with docker-compose.kernel-candidate.yml.
services:
  app:
    build:
      args:
        KOKONUT_CLICKHOUSE: "true"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      KOKONUT_FEATURE_CLICKHOUSE: "true"
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set for analytics}
      CH_HOST: clickhouse
      CH_PORT: "8123"
      CH_USER: kokonut
      CH_DB: kokonut_analytics

  clickhouse:
    image: clickhouse/clickhouse-server:25.8@sha256:a9d328123ff8a61bf6b16448528b577d59deb85758172e13b09054b0727f8adf
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: kokonut_analytics
      CLICKHOUSE_USER: kokonut
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set for analytics}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      - kernel-clickhouse-data:/var/lib/clickhouse
      - kernel-clickhouse-logs:/var/log/clickhouse-server
      - ./config/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    networks:
      - kernel
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  kernel-clickhouse-data:
  kernel-clickhouse-logs:
