# Optional ingress; combine with candidate and optionally standard role overlay.
# Local-only defaults. Public exposure requires explicit bind/domain selection.
services:
  proxy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - "${KOKONUT_KERNEL_PROXY_BIND:-127.0.0.1}:${KOKONUT_KERNEL_HTTP_PORT:-8088}:80"
      - "${KOKONUT_KERNEL_PROXY_BIND:-127.0.0.1}:${KOKONUT_KERNEL_HTTPS_PORT:-8448}:443"
    environment:
      KOKONUT_KERNEL_DOMAIN: ${KOKONUT_KERNEL_DOMAIN:-localhost}
      KOKONUT_KERNEL_HTTPS_PORT: ${KOKONUT_KERNEL_HTTPS_PORT:-8448}
    volumes:
      - ./config/caddy/Caddyfile.kernel:/etc/caddy/Caddyfile:ro
      - kernel-caddy-data:/data
      - kernel-caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - kernel

volumes:
  kernel-caddy-data:
  kernel-caddy-config:
