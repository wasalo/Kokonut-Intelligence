# Split roles; combine only with the standalone Kernel candidate.
# Explicit environment duplication keeps both roles on the same provider policy.
services:
  app:
    command: ["python3", "-m", "services.core.runtime", "--port", "8099", "--require-schema", "--require-runtime-role"]
    depends_on:
      report-snapshot-export-artifact-init:
        condition: service_completed_successfully
    environment:
      KOKONUT_RATE_LIMIT_PROVIDER: ${KOKONUT_RATE_LIMIT_PROVIDER:-postgres}
      KOKONUT_FEATURE_DIRECTUS: ${KOKONUT_FEATURE_DIRECTUS:-false}
      KOKONUT_FEATURE_LEGACY_DATASET_SQL: ${KOKONUT_FEATURE_LEGACY_DATASET_SQL:-false}
      # Private field media belongs to the API process. The runtime supervisor
      # strips these settings from scheduler/event/notification children.
      MOBILE_MEDIA_PROVIDER: ${MOBILE_MEDIA_PROVIDER:-s3}
      MOBILE_MEDIA_ENCRYPTION_KEY: ${MOBILE_MEDIA_ENCRYPTION_KEY:-${MOBILE_MEDIA_LOCAL_KEY:-}}
      MOBILE_MEDIA_S3_ENDPOINT: ${MOBILE_MEDIA_S3_ENDPOINT:-}
      MOBILE_MEDIA_S3_BUCKET: ${MOBILE_MEDIA_S3_BUCKET:-kokonut-kernel-media}
      MOBILE_MEDIA_S3_ACCESS_KEY_ID: ${MOBILE_MEDIA_S3_ACCESS_KEY_ID:-}
      MOBILE_MEDIA_S3_SECRET_ACCESS_KEY: ${MOBILE_MEDIA_S3_SECRET_ACCESS_KEY:-}
      MOBILE_MEDIA_S3_REGION: ${MOBILE_MEDIA_S3_REGION:-auto}
      # The Gateway can read only completed private report artifacts. Its
      # separate R2 key never reaches scheduled or event-handler children.
      KOKONUT_PRIVATE_EXPORT_PROVIDER: ${KOKONUT_PRIVATE_EXPORT_PROVIDER:-local}
      KOKONUT_PRIVATE_EXPORT_DIR: /var/lib/kokonut/report-snapshot-exports
      KOKONUT_PRIVATE_EXPORT_S3_ENDPOINT: ${KOKONUT_PRIVATE_EXPORT_S3_ENDPOINT:-}
      KOKONUT_PRIVATE_EXPORT_S3_BUCKET: ${KOKONUT_PRIVATE_EXPORT_S3_BUCKET:-}
      KOKONUT_PRIVATE_EXPORT_S3_REGION: ${KOKONUT_PRIVATE_EXPORT_S3_REGION:-auto}
      KOKONUT_PRIVATE_EXPORT_S3_READER_ACCESS_KEY_ID: ${KOKONUT_PRIVATE_EXPORT_S3_READER_ACCESS_KEY_ID:-}
      KOKONUT_PRIVATE_EXPORT_S3_READER_SECRET_ACCESS_KEY: ${KOKONUT_PRIVATE_EXPORT_S3_READER_SECRET_ACCESS_KEY:-}
      DIRECTUS_URL: ${DIRECTUS_URL:-http://directus:8055}
      DIRECTUS_ADMIN_TOKEN: ${DIRECTUS_ADMIN_TOKEN:-}
      # The API creates intents from a non-secret presence flag; only the
      # delivery worker receives the endpoint itself. Set the flag explicitly
      # when ALERT_WEBHOOK_URL is configured; the simple default interpolation
      # is compatible with Compose parsers that do not implement the `:+` form.
      ALERT_WEBHOOK_URL: ""
      KOKONUT_NOTIFICATION_WEBHOOK_CONFIGURED: ${KOKONUT_NOTIFICATION_WEBHOOK_CONFIGURED:-false}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-587}
      ALERT_SMTP_TLS_MODE: ${ALERT_SMTP_TLS_MODE:-starttls}
      # Compose merges this overlay with the candidate app environment. Clear
      # inherited SMTP credentials so only the delivery worker receives them.
      ALERT_SMTP_USER: ""
      ALERT_SMTP_PASSWORD: ""
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-alerts@kokonut.network}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      KOKONUT_NOTIFICATION_OUTBOX_WARN_BYTES: ${KOKONUT_NOTIFICATION_OUTBOX_WARN_BYTES:-268435456}
      KOKONUT_NOTIFICATION_OUTBOX_CRITICAL_BYTES: ${KOKONUT_NOTIFICATION_OUTBOX_CRITICAL_BYTES:-536870912}
    volumes:
      - type: volume
        source: report-snapshot-export-artifacts
        target: /var/lib/kokonut/report-snapshot-exports
        read_only: true

  worker:
    init: true
    stop_grace_period: 40s
    image: ${KOKONUT_KERNEL_APP_IMAGE:-kokonut-kernel-candidate:local}
    build:
      context: .
      dockerfile: Dockerfile.kernel
    restart: unless-stopped
    command: ["python3", "-m", "services.core.runtime", "--workers-only", "--require-schema", "--require-runtime-role"]
    healthcheck:
      test: ["CMD", "python3", "-m", "services.core.worker_progress", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      database:
        condition: service_healthy
    environment:
      PG_HOST: database
      PG_PORT: "5432"
      PG_DB: kokonut_intelligence
      PG_USER: ${KOKONUT_RUNTIME_USER:?KOKONUT_RUNTIME_USER must be set}
      KOKONUT_ENV: production
      PG_PASSWORD: ${KOKONUT_RUNTIME_PASSWORD:?KOKONUT_RUNTIME_PASSWORD must be set}
      # Coolify may inject application-level variables into every service.
      # Explicitly clear Collector media settings so credentials and storage
      # configuration remain exclusive to the API process.
      MOBILE_MEDIA_PROVIDER: ""
      MOBILE_MEDIA_LOCAL_DIRECTORY: ""
      MOBILE_MEDIA_LOCAL_KEY: ""
      MOBILE_MEDIA_ENCRYPTION_KEY: ""
      MOBILE_MEDIA_S3_ENDPOINT: ""
      MOBILE_MEDIA_S3_BUCKET: ""
      MOBILE_MEDIA_S3_ACCESS_KEY_ID: ""
      MOBILE_MEDIA_S3_SECRET_ACCESS_KEY: ""
      MOBILE_MEDIA_S3_REGION: ""
      KOKONUT_SENSOR_ANOMALY_DATABASE_URL: ${KOKONUT_SENSOR_ANOMALY_DATABASE_URL:-}
      KOKONUT_SENSOR_ANOMALY_WORKER_CREDENTIAL: ${KOKONUT_SENSOR_ANOMALY_WORKER_CREDENTIAL:-}
      KOKONUT_CACHE_INVALIDATION_DATABASE_URL: ${KOKONUT_CACHE_INVALIDATION_DATABASE_URL:-}
      KOKONUT_CACHE_INVALIDATION_WORKER_CREDENTIAL: ${KOKONUT_CACHE_INVALIDATION_WORKER_CREDENTIAL:-}
      KOKONUT_NOTIFICATION_ENQUEUE_DATABASE_URL: ${KOKONUT_NOTIFICATION_ENQUEUE_DATABASE_URL:-}
      KOKONUT_FEATURE_ISOLATED_NOTIFICATION_ENQUEUE: ${KOKONUT_FEATURE_ISOLATED_NOTIFICATION_ENQUEUE:-false}
      KOKONUT_FEATURE_SIGNED_CACHE_INVALIDATION: ${KOKONUT_FEATURE_SIGNED_CACHE_INVALIDATION:-false}
      KOKONUT_NOI_SNAPSHOT_DATABASE_URL: ${KOKONUT_NOI_SNAPSHOT_DATABASE_URL:-}
      KOKONUT_NOI_SNAPSHOT_WORKER_CREDENTIAL: ${KOKONUT_NOI_SNAPSHOT_WORKER_CREDENTIAL:-}
      KOKONUT_FEATURE_SIGNED_NOI_SNAPSHOT_WORKER: ${KOKONUT_FEATURE_SIGNED_NOI_SNAPSHOT_WORKER:-false}
      KOKONUT_CREDIT_ADJUSTMENT_DATABASE_URL: ${KOKONUT_CREDIT_ADJUSTMENT_DATABASE_URL:-}
      KOKONUT_CREDIT_ADJUSTMENT_WORKER_CREDENTIAL: ${KOKONUT_CREDIT_ADJUSTMENT_WORKER_CREDENTIAL:-}
      KOKONUT_FEATURE_SIGNED_CREDIT_ADJUSTMENT_WORKER: ${KOKONUT_FEATURE_SIGNED_CREDIT_ADJUSTMENT_WORKER:-false}
      KOKONUT_WEATHER_FORECAST_DATABASE_URL: ${KOKONUT_WEATHER_FORECAST_DATABASE_URL:-}
      KOKONUT_WEATHER_FORECAST_WORKER_CREDENTIAL: ${KOKONUT_WEATHER_FORECAST_WORKER_CREDENTIAL:-}
      KOKONUT_WEATHER_FORECAST_OPENWEATHERMAP_API_KEY: ${KOKONUT_WEATHER_FORECAST_OPENWEATHERMAP_API_KEY:-}
      KOKONUT_FEATURE_SIGNED_WEATHER_FORECAST_WORKER: ${KOKONUT_FEATURE_SIGNED_WEATHER_FORECAST_WORKER:-false}
      KOKONUT_WEATHER_DATABASE_URL: ${KOKONUT_WEATHER_DATABASE_URL:-}
      KOKONUT_WEATHER_WORKER_CREDENTIAL: ${KOKONUT_WEATHER_WORKER_CREDENTIAL:-}
      KOKONUT_WEATHER_OPENWEATHERMAP_API_KEY: ${KOKONUT_WEATHER_OPENWEATHERMAP_API_KEY:-}
      KOKONUT_FEATURE_SIGNED_WEATHER_WORKER: ${KOKONUT_FEATURE_SIGNED_WEATHER_WORKER:-false}
      KOKONUT_CLIMATE_DATABASE_URL: ${KOKONUT_CLIMATE_DATABASE_URL:-}
      KOKONUT_CLIMATE_WORKER_CREDENTIAL: ${KOKONUT_CLIMATE_WORKER_CREDENTIAL:-}
      KOKONUT_CLIMATE_GEE_SERVICE_ACCOUNT_KEY: ${KOKONUT_CLIMATE_GEE_SERVICE_ACCOUNT_KEY:-}
      KOKONUT_FEATURE_SIGNED_CLIMATE_WORKER: ${KOKONUT_FEATURE_SIGNED_CLIMATE_WORKER:-false}
      KOKONUT_MARKET_DATA_DATABASE_URL: ${KOKONUT_MARKET_DATA_DATABASE_URL:-}
      KOKONUT_FEATURE_ISOLATED_MARKET_DATA_WORKER: ${KOKONUT_FEATURE_ISOLATED_MARKET_DATA_WORKER:-false}
      KOKONUT_EAS_INDEXER_DATABASE_URL: ${KOKONUT_EAS_INDEXER_DATABASE_URL:-}
      KOKONUT_FEATURE_ISOLATED_EAS_INDEXER_WORKER: ${KOKONUT_FEATURE_ISOLATED_EAS_INDEXER_WORKER:-false}
      KOKONUT_RPC_INDEXER_DATABASE_URL: ${KOKONUT_RPC_INDEXER_DATABASE_URL:-}
      KOKONUT_RPC_INDEXER_RPC_ENDPOINTS: ${KOKONUT_RPC_INDEXER_RPC_ENDPOINTS:-}
      KOKONUT_FEATURE_ISOLATED_RPC_INDEXER_WORKER: ${KOKONUT_FEATURE_ISOLATED_RPC_INDEXER_WORKER:-false}
      KOKONUT_GNOSIS_INDEXER_DATABASE_URL: ${KOKONUT_GNOSIS_INDEXER_DATABASE_URL:-}
      KOKONUT_GNOSIS_INDEXER_RPC_ENDPOINTS: ${KOKONUT_GNOSIS_INDEXER_RPC_ENDPOINTS:-}
      KOKONUT_FEATURE_ISOLATED_GNOSIS_INDEXER_WORKER: ${KOKONUT_FEATURE_ISOLATED_GNOSIS_INDEXER_WORKER:-false}
      KOKONUT_BAAL_INDEXER_DATABASE_URL: ${KOKONUT_BAAL_INDEXER_DATABASE_URL:-}
      KOKONUT_BAAL_INDEXER_RPC_ENDPOINT: ${KOKONUT_BAAL_INDEXER_RPC_ENDPOINT:-}
      KOKONUT_FEATURE_ISOLATED_BAAL_INDEXER_WORKER: ${KOKONUT_FEATURE_ISOLATED_BAAL_INDEXER_WORKER:-false}
      KOKONUT_FRESHNESS_DATABASE_URL: ${KOKONUT_FRESHNESS_DATABASE_URL:-}
      KOKONUT_FEATURE_ISOLATED_FRESHNESS_WORKER: ${KOKONUT_FEATURE_ISOLATED_FRESHNESS_WORKER:-false}
      KOKONUT_CLICKHOUSE_OUTBOX_DATABASE_URL: ${KOKONUT_CLICKHOUSE_OUTBOX_DATABASE_URL:-}
      KOKONUT_FEATURE_ISOLATED_CLICKHOUSE_OUTBOX_WORKER: ${KOKONUT_FEATURE_ISOLATED_CLICKHOUSE_OUTBOX_WORKER:-false}
      KOKONUT_EVENT_DISPATCH_DATABASE_URL: ${KOKONUT_EVENT_DISPATCH_DATABASE_URL:-}
      KOKONUT_FEATURE_ISOLATED_EVENT_DISPATCH: ${KOKONUT_FEATURE_ISOLATED_EVENT_DISPATCH:-false}
      KOKONUT_NOTIFICATION_DELIVERY_DATABASE_URL: ${KOKONUT_NOTIFICATION_DELIVERY_DATABASE_URL:-}
      KOKONUT_FEATURE_ISOLATED_NOTIFICATION_DELIVERY: ${KOKONUT_FEATURE_ISOLATED_NOTIFICATION_DELIVERY:-false}
      KOKONUT_SENSOR_INGESTION_DATABASE_URL: ${KOKONUT_SENSOR_INGESTION_DATABASE_URL:-}
      KOKONUT_SENSOR_INGESTION_WORKER_CREDENTIAL: ${KOKONUT_SENSOR_INGESTION_WORKER_CREDENTIAL:-}
      KOKONUT_FEATURE_SIGNED_SENSOR_INGESTION_WORKER: ${KOKONUT_FEATURE_SIGNED_SENSOR_INGESTION_WORKER:-false}
      KOKONUT_REMOTE_SENSING_DATABASE_URL: ${KOKONUT_REMOTE_SENSING_DATABASE_URL:-}
      KOKONUT_REMOTE_SENSING_WORKER_CREDENTIAL: ${KOKONUT_REMOTE_SENSING_WORKER_CREDENTIAL:-}
      KOKONUT_REMOTE_SENSING_GEE_SERVICE_ACCOUNT_KEY: ${KOKONUT_REMOTE_SENSING_GEE_SERVICE_ACCOUNT_KEY:-}
      KOKONUT_REMOTE_SENSING_COPERNICUS_EMAIL: ${KOKONUT_REMOTE_SENSING_COPERNICUS_EMAIL:-}
      KOKONUT_REMOTE_SENSING_COPERNICUS_PASSWORD: ${KOKONUT_REMOTE_SENSING_COPERNICUS_PASSWORD:-}
      KOKONUT_REMOTE_SENSING_COPERNICUS_CLIENT_ID: ${KOKONUT_REMOTE_SENSING_COPERNICUS_CLIENT_ID:-}
      KOKONUT_REMOTE_SENSING_COPERNICUS_CLIENT_SECRET: ${KOKONUT_REMOTE_SENSING_COPERNICUS_CLIENT_SECRET:-}
      KOKONUT_FEATURE_SIGNED_REMOTE_SENSING_WORKER: ${KOKONUT_FEATURE_SIGNED_REMOTE_SENSING_WORKER:-false}
      WORLD_BANK_PINK_SHEET_URL: ${WORLD_BANK_PINK_SHEET_URL:-}
      KOKONUT_ANALYTICS_USER: ${KOKONUT_ANALYTICS_USER:-kokonut_analytics_ro}
      KOKONUT_ANALYTICS_PASSWORD: ${KOKONUT_ANALYTICS_PASSWORD:-}
      KOKONUT_FEATURE_DIRECTUS: ${KOKONUT_FEATURE_DIRECTUS:-false}
      KOKONUT_FEATURE_EVENT_BUS: ${KOKONUT_FEATURE_EVENT_BUS:-true}
      KOKONUT_FEATURE_NOTIFICATION_DELIVERY: ${KOKONUT_FEATURE_NOTIFICATION_DELIVERY:-${KOKONUT_FEATURE_EVENT_BUS:-true}}
      KOKONUT_FEATURE_LEGACY_DATASET_SQL: ${KOKONUT_FEATURE_LEGACY_DATASET_SQL:-false}
      KOKONUT_FEATURE_CLICKHOUSE: "false"
      KOKONUT_FEATURE_GRPC: "false"
      KOKONUT_FEATURE_METABASE: "false"
      KOKONUT_FEATURE_MQTT: "false"
      KOKONUT_FEATURE_PREFECT: "false"
      KOKONUT_SENSOR_CSV_ROOT: /var/lib/kokonut/sensor-inputs
      DIRECTUS_URL: ${DIRECTUS_URL:-http://directus:8055}
      DIRECTUS_ADMIN_TOKEN: ${DIRECTUS_ADMIN_TOKEN:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-587}
      ALERT_SMTP_TLS_MODE: ${ALERT_SMTP_TLS_MODE:-starttls}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-alerts@kokonut.network}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      KOKONUT_NOTIFICATION_OUTBOX_WARN_BYTES: ${KOKONUT_NOTIFICATION_OUTBOX_WARN_BYTES:-268435456}
      KOKONUT_NOTIFICATION_OUTBOX_CRITICAL_BYTES: ${KOKONUT_NOTIFICATION_OUTBOX_CRITICAL_BYTES:-536870912}
      KOKONUT_WORKER_PROGRESS_STALE_SECONDS: ${KOKONUT_WORKER_PROGRESS_STALE_SECONDS:-300}
      KOKONUT_WORKER_PROGRESS_BACKLOG_SECONDS: ${KOKONUT_WORKER_PROGRESS_BACKLOG_SECONDS:-900}
      KOKONUT_WORKER_PROGRESS_HEARTBEAT_SECONDS: ${KOKONUT_WORKER_PROGRESS_HEARTBEAT_SECONDS:-60}
      KOKONUT_WORKER_PROGRESS_HEARTBEAT_FILE: /var/lib/kokonut/worker-progress/supervisor.json
    networks:
      - kernel
    volumes:
      - kernel-gateway-audit-spool:/var/lib/kokonut/gateway-audit
      - type: bind
        source: ${KOKONUT_SENSOR_CSV_HOST_DIR:-./data/sensor-inputs}
        target: /var/lib/kokonut/sensor-inputs
        read_only: true

  report-snapshot-export-worker:
    init: true
    stop_grace_period: 20s
    image: ${KOKONUT_KERNEL_APP_IMAGE:-kokonut-kernel-candidate:local}
    build:
      context: .
      dockerfile: Dockerfile.kernel
      target: kernel
    command:
      - python3
      - -m
      - services.export.report_snapshot_export_worker
      - --worker-id
      - kokonut-report-snapshot-export
      - --limit
      - "10"
      - --lease-seconds
      - "300"
    user: appuser
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
      report-snapshot-export-artifact-init:
        condition: service_completed_successfully
    environment:
      KOKONUT_ENV: production
      KOKONUT_FEATURE_ISOLATED_REPORT_SNAPSHOT_EXPORT_WORKER: ${KOKONUT_FEATURE_ISOLATED_REPORT_SNAPSHOT_EXPORT_WORKER:-false}
      KOKONUT_REPORT_SNAPSHOT_EXPORT_DATABASE_URL: ${KOKONUT_REPORT_SNAPSHOT_EXPORT_DATABASE_URL:-}
      KOKONUT_PRIVATE_EXPORT_PROVIDER: ${KOKONUT_PRIVATE_EXPORT_PROVIDER:-local}
      KOKONUT_PRIVATE_EXPORT_DIR: /var/lib/kokonut/report-snapshot-exports
      KOKONUT_PRIVATE_EXPORT_S3_ENDPOINT: ${KOKONUT_PRIVATE_EXPORT_S3_ENDPOINT:-}
      KOKONUT_PRIVATE_EXPORT_S3_BUCKET: ${KOKONUT_PRIVATE_EXPORT_S3_BUCKET:-}
      KOKONUT_PRIVATE_EXPORT_S3_REGION: ${KOKONUT_PRIVATE_EXPORT_S3_REGION:-auto}
      KOKONUT_PRIVATE_EXPORT_S3_WORKER_ACCESS_KEY_ID: ${KOKONUT_PRIVATE_EXPORT_S3_WORKER_ACCESS_KEY_ID:-}
      KOKONUT_PRIVATE_EXPORT_S3_WORKER_SECRET_ACCESS_KEY: ${KOKONUT_PRIVATE_EXPORT_S3_WORKER_SECRET_ACCESS_KEY:-}
    networks:
      - kernel
    volumes:
      - report-snapshot-export-artifacts:/var/lib/kokonut/report-snapshot-exports
    profiles:
      - report-snapshot-export

  report-snapshot-export-artifact-init:
    image: ${KOKONUT_KERNEL_APP_IMAGE:-kokonut-kernel-candidate:local}
    build:
      context: .
      dockerfile: Dockerfile.kernel
      target: kernel
    user: "0:0"
    command:
      - sh
      - -c
      - install -d -o 10001 -g 10001 -m 0700 /var/lib/kokonut/report-snapshot-exports
    restart: "no"
    network_mode: none
    volumes:
      - report-snapshot-export-artifacts:/var/lib/kokonut/report-snapshot-exports

volumes:
  report-snapshot-export-artifacts:
