services:
  database:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: kokonut
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kokonut_intelligence
    networks:
      - databases
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kokonut -d kokonut_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    networks:
      - databases
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  directus:
    image: directus/directus:12.1.1@sha256:27fd291463f4e746a7911139377a1dbc7a5c09ae82ee15b028b97bcc4950c69d
    restart: unless-stopped
    ports:
      - "127.0.0.1:8055:8055"
    volumes:
      - directus-uploads:/directus/uploads
      - ./extensions:/directus/extensions
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - databases
      - apps
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8055/server/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: "pg"
      DB_HOST: "database"
      DB_PORT: "5432"
      DB_DATABASE: "kokonut_intelligence"
      DB_USER: "kokonut"
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SEARCH_PATH: "public,kokonut"
      CACHE_ENABLED: "true"
      CACHE_AUTO_PURGE: "true"
      CACHE_STORE: "redis"
      REDIS: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@cache:6379"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8055}
      LOG_LEVEL: "info"
      WEBSOCKETS_ENABLED: "true"
      FILES_MAX_UPLOAD_SIZE: "50mb"
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_STORE: "redis"
      RATE_LIMITER_POINTS: "100"
      RATE_LIMITER_DURATION: "1"
      LOGIN_RATELIMIT_ENABLED: "true"
      LOGIN_RATELIMIT_POINTS: "5"
      LOGIN_RATELIMIT_DURATION: "900000"
      CORS_ORIGIN: ${CORS_ORIGIN:-"http://localhost:8055,http://localhost:3001"}
      PUBLIC_RESTRICT: "true"

  metabase:
    image: metabase/metabase:v0.62.4@sha256:22ddc782a45f8aecf47c0f039b86a323435565595643e429fb33d29939b41675
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - metabase-data:/metabase-data
    networks:
      - databases
      - apps
    environment:
      MB_DB_TYPE: "postgres"
      MB_DB_DBNAME: "metabase"
      MB_DB_PORT: 5432
      MB_DB_USER: "kokonut"
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: "database"
      MB_ENABLE_EMBEDDING: "true"
      MB_EMBEDDING_APP_ORIGIN: "http://localhost:3001"
      MB_EMBEDDING_SECRET_KEY: ${METABASE_EMBEDDING_SECRET_KEY:?Set METABASE_EMBEDDING_SECRET_KEY in .env}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  clickhouse:
    image: clickhouse/clickhouse-server:25.8@sha256:a9d328123ff8a61bf6b16448528b577d59deb85758172e13b09054b0727f8adf
    restart: unless-stopped
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./config/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    networks:
      - databases
    environment:
      CLICKHOUSE_DB: kokonut_analytics
      CLICKHOUSE_USER: kokonut
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - directus
      - metabase
    networks:
      - apps

  grpc:
    build:
      context: .
      dockerfile: Dockerfile.grpc
    restart: unless-stopped
    ports:
      - "127.0.0.1:50051:50051"
    environment:
      - PG_HOST=database
      - PG_PORT=5432
      - PG_DB=kokonut_intelligence
      - PG_USER=kokonut
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - GRPC_PORT=50051
      - GRPC_MAX_WORKERS=10
      - KOKONUT_ENV=${KOKONUT_ENV:-dev}
    networks:
      - databases
      - apps
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import grpc; from services.grpc.server import serve; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mosquitto:
    image: eclipse-mosquitto:2@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    restart: unless-stopped
    ports:
      - "127.0.0.1:8883:8883"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/mosquitto/acl:/mosquitto/config/acl:ro
      - ./config/mosquitto/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    networks:
      - databases
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt --cert /mosquitto/certs/healthcheck.crt --key /mosquitto/certs/healthcheck.key -t '$$SYS/#' -C 1 -i healthcheck -W 3 | grep -q . || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
  directus-uploads:
  metabase-data:
  clickhouse-data:
  clickhouse-logs:
  caddy-data:
  caddy-config:
  mosquitto-data:

networks:
  databases:
    driver: bridge
  apps:
    driver: bridge
